- trigger:
    - trigger: time_pattern
      hours: "/1"
    - trigger: homeassistant
      event: start
    - trigger: event
      event_type: event_template_reloaded # Zorgt dat hij DIRECT start bij handmatig herladen
  action:
    - action: weather.get_forecasts
      data:
        type: hourly
      target:
        entity_id: weather.peize
      response_variable: knmi_hourly
  binary_sensor:
    - name: "Ramen Open Advies"
      icon: mdi:window-open-variant
      device_class: opening
      
      # Dit wordt nu wél aangemaakt omdat de state hieronder niet meer crasht
      attributes:
        voorspellingen: "{{ knmi_hourly['weather.peize'].forecast }}"

      availability: >
        {{ states('sensor.kamertemperatuur_gemiddeld') | float(none) is not none and
           states('sensor.buitentemperatuur_gemiddeld') | float(none) is not none }}

      state: >
        {% set binnen = states('sensor.kamertemperatuur_gemiddeld') | float(0) %}
        {% set buiten = states('sensor.buitentemperatuur_gemiddeld') | float(0) %}
        
        {% set voorspellingen = knmi_hourly['weather.peize'].forecast | default([], true) %}
        
        {# DE FIX: Hier zijn de, [1] en [2] toegevoegd om de juiste uren te pakken #}
        {% if voorspellingen and voorspellingen | length >= 3 %}
          {% set temp_u0 = voorspellingen[0].temperature | float(0) %}
          {% set temp_u1 = voorspellingen[1].temperature | float(0) %}
          {% set temp_u2 = voorspellingen[2].temperature | float(0) %}
          {% set max_verwacht_buiten = [temp_u0, temp_u1, temp_u2] | max %}
        {% else %}
          {% set max_verwacht_buiten = buiten %}
        {% endif %}
        
        {% if binnen < 23.0 and buiten < 23.0 %}
          off
        {% else %}
          {% set huidige_status = is_state('binary_sensor.ramen_open_advies', 'on') %}
          
          {% if huidige_status %}
            {{ buiten < (binnen + 0.2) }}
          {% else %}
            {{ buiten <= (binnen - 0.3) and max_verwacht_buiten <= (binnen - 0.3) }}
          {% endif %}
        {% endif %}



        
