###   Energie   ####

#
# Huidig vermogen [W]
# berekend op basis van Enphase en P1mon gegevens
#
- sensor:
    - name: "Huidig vermogen W"
      unique_id: huidig_vermogen_w
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      icon: mdi:home-lightning-bolt-outline
      availability: >
        {{ has_value('sensor.envoy_122025007960_power_production') and
           has_value('sensor.smartmeter_stroomverbruik') and
           has_value('sensor.smartmeter_stroomproductie') }}
      state: >
        {% set productie = states('sensor.envoy_122025007960_power_production') | int(0) %}
        {% set verbruik = states('sensor.smartmeter_stroomverbruik') | int(0) %}
        {% set levering = states('sensor.smartmeter_stroomproductie') | int(0) %}
        {% set totaal = productie + verbruik - levering %}

        {% if totaal > 0 %}
          {{ totaal }}
        {% else %}
          {{ this.state | default(0, true) }}
        {% endif %}

#        # {% else %}
#        #   {{ states('sensor.huidig_vermogen_w') }}
#        # {% endif %}
#
# Energieverbruik [kWh]
# berekend op basis van P1mon gegevens
#
- sensor:
    - name: "Energie verbruik kWh"
      unique_id: energie_verbruik_kwh
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: "kWh"
      icon: mdi:home-lightning-bolt-outline
      availability: >
        {{  states('sensor.smartmeter_energieverbruik_laag_tarief') not in ['unavailable', 'unknown'] and
            states('sensor.smartmeter_energieverbruik_hoog_tarief') not in ['unavailable', 'unknown']
        }}
      state: >
        {% set laag = states('sensor.smartmeter_energieverbruik_laag_tarief') | float(0) %}
        {% set hoog = states('sensor.smartmeter_energieverbruik_hoog_tarief') | float(0) %}
        {% set laag1 = states('sensor.smartmeter_energieproductie_laag_tarief') | float(0) %}
        {% set hoog1 = states('sensor.smartmeter_energieproductie_hoog_tarief') | float(0) %}
        {% set energie = laag + hoog %}
        {{ energie }}

- sensor:
    - name: Frank prices
      unique_id: frank_prices
      availability: >
        {{ states('sensor.Frank_energie_prijzen_gemiddelde_elektriciteitsprijs_alle_uren_all_in') not in ['unavailable', 'unknown'] }}
      state: >
        {% set t = now().hour %}
        {% set prijs = state_attr('sensor.Frank_energie_prijzen_gemiddelde_elektriciteitsprijs_alle_uren_all_in', 'all_prices')[t].price | float %}
        {{ prijs }}
      attributes:
        data: >
          {% set ns = namespace(items=[]) %}
          {% for item in states.sensor.frank_energie_prijzen_gemiddelde_elektriciteitsprijs_alle_uren_all_in.attributes.all_prices %}
          {% set ns.items = ns.items + [{
          'start_time': (item.from | as_datetime | as_local).isoformat(),
          'price_per_kwh': item.price
          }] %}
          {% endfor %}
          {{ ns.items | sort(attribute='start_time') }}

