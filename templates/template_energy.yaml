- trigger:
    - trigger: state
      entity_id:
        - sensor.frank_energie_prijzen_huidige_elektriciteitsprijs_all_in
      from: null
      to: null
    - trigger: state
      entity_id:
        - binary_sensor.frank_slim_terugleveren
      from:
        - "off"
      to:
        - "on"
      id: Slim terugleveren aan
    - trigger: state
      entity_id:
        - binary_sensor.frank_slim_terugleveren
      from:
        - "on"
      to:
        - "off"
      id: Slim terugleveren uit
    # - trigger: time_pattern
    #   seconds: "10"
    - trigger: state
      entity_id:
        - sensor.energie_verbruik_kwh
      # from:
      #   - "null" 
      # to:
      #   - "null" 
  sensor:
      - name: Frank slim terugleveren bedrag
        unique_id: frank_slim_terugleveren_bedrag
        device_class: monetary
        state_class: total
        unit_of_measurement: €
        availability: >
          {{ states('binary_sensor.frank_slim_terugleveren') not in ['unavailable', 'unknown'] }} and
            states('sensor.energie_verbruik_kwh') not in ['unavailable', 'unknown'] }} and
            states('sensor.frank_energie_prijzen_huidige_elektriciteitsprijs_all_in') not in ['unavailable', 'unknown'] }}
        state: >
          {% if is_state('binary_sensor.frank_slim_terugleveren', 'on') %}
            {#% set tijd = (now() - states.binary_sensor.frank_slim_terugleveren.last_changed).total_seconds() %#}
            {% set bedrag = state_attr('sensor.frank_slim_terugleveren_bedrag', "bedrag_som") | float(0) %}
              {{ bedrag | round(2) }}
            {% endif %}
        attributes:
          huidige_prijs: >- 
            {% set prijs = states('sensor.frank_energie_prijzen_huidige_elektriciteitsprijs_all_in') | float(0) %}
            {{ prijs }}
          energie_laatst: >- 
            {% set kwh = state_attr('sensor.frank_slim_terugleveren_bedrag', "energie_nu") | float(0) %}
            {{ kwh }}
          energie_nu: >- 
            {% set kwh = states('sensor.energie_verbruik_kwh') | float(0) %}
            {{ kwh }}
          energie: >- 
            {% set kwh_nu = state_attr('sensor.frank_slim_terugleveren_bedrag', "energie_nu") | float(0) %}
            {% set kwh_laatst = state_attr('sensor.frank_slim_terugleveren_bedrag', "energie_laatst") | float(0) %}
            {{ kwh_nu - kwh_laatst }}

          bedrag_som: >- 
            {% set bedrag_delta = state_attr('sensor.frank_slim_terugleveren_bedrag', "bedrag_delta") | float(0) %}
            {% set bedrag_nu = state_attr('sensor.frank_slim_terugleveren_bedrag', "bedrag_som") | float(0) %}
              {{ (bedrag_nu + bedrag_delta) | round(5) }}
          bedrag_delta: >- 
            {% set kwh = state_attr('sensor.frank_slim_terugleveren_bedrag', "energie") | float(0) %}
            {% set prijs = states('sensor.frank_energie_prijzen_huidige_elektriciteitsprijs_all_in') | float(0) %}
              {{ kwh * prijs }}



