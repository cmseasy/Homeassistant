template:

###   WTW warmte terugwin uit   ###

#
# WTW debiet
#
  - sensor:
    - unique_id: ducobox_debiet
      name: "Ducobox debiet"
      unit_of_measurement: "m³/h"
      device_class: volume_flow_rate
      icon: mdi:air-filter
      availability: >
        {{  states('sensor.ducobox_aanvoerventilator_pwm') not in ['unavailable', 'unknown'] and
            states('sensor.ducobox_afvoerventilator_pwm') not in ['unavailable', 'unknown']
        }}
      state: >-
        {{ (states('sensor.ducobox_aanvoerventilator_pwm') | float(0)
        + states('sensor.ducobox_afvoerventilator_pwm') | float(0) )
        / 2 * 150 / 100 
        }}

#
## Duco box WTW Rendement
#
  - sensor:
      - name: "Duco box Rendement"
        unique_id: duco_box_rendement
        state_class: measurement
        unit_of_measurement: "%"
        availability: >
          {{  states('sensor.ducobox_aanvoertemperatuur') | is_number | float > 0 and
              states('sensor.ducobox_buitentemperatuur') | is_number | float > 0 and
              states('sensor.ducobox_uitblaastemperatuur') | is_number | float > 0 and
              states('sensor.ducobox_retourtemperatuur') | is_number | float > 0
          }}
        state: >
          {% set tnw = states("sensor.ducobox_aanvoertemperatuur") | float(0) | round(1) %}
          {% set tvb = states("sensor.ducobox_buitentemperatuur") | float(0) | round(1) %} 
          {% set anb = states("sensor.ducobox_uitblaastemperatuur") | float(0) | round(1) %}  
          {% set avw = states("sensor.ducobox_retourtemperatuur") | float(0) | round(1) %}
          {% set rendement = 0 %}
          {% if avw != tvb %}
            {% set rendement = (((tnw-tvb)/(avw-tvb))*100)  | float(-1.0) | round(1) %}          
          {% endif %}
          {% if rendement < 0 %}
            {% set rendement = 0 | float(0) | round(1) %} 
          {% endif %}
          {% if rendement > 100 %}
            {% set rendement = 100 | float(0) | round(1) %} 
          {% endif %}
          {{ rendement }}

