  - sensor:
    - unique_id: absolute_humidity_buiten
      name: "Abolute humidity buiten"
      state_class: measurement
      unit_of_measurement: 'g/m³'
      availability: >
        {{ has_value('sensor.buitenluchtvochtigheid_gemiddeld') and 
          has_value('sensor.buitentemperatuur_gemiddeld') }}
      state: >
        {% set h = states('sensor.buitenluchtvochtigheid_gemiddeld') | float(0) %}
        {% set t = states('sensor.buitentemperatuur_gemiddeld') | float(0) %}
        {{ (h * 6.112 * 2.1674 * (e ** ((t * 17.67) / (t + 243.5))) / (t + 273.15)) | round(2) }}


  - sensor:
      - name: "Duco RHSetpoint gewenst"
        unique_id: duco_wtw_gewenst_rhsetpoint
        unit_of_measurement: '%'
        availability: >
          {{ states('sensor.smart_thermostat_x_luchtvochtigheid') | is_number }}
        state: >
          {{ (((((states('sensor.smart_thermostat_x_luchtvochtigheid') | float(55)) + 2.5 + 0) / 10) | round(1, "half", 0) * 10), 55) | max | int }}
        # Uitleg: + 2,5 = afronding naar 'ceil' en de plus daarna is de offset

  - sensor:
    - name: "Dauwpunt Ducobox"
      unique_id: dauwpunt_ducobox
      device_class: temperature
      unit_of_measurement: "°C"
      availability: >
        {{  states('sensor.box_ucrh_humidity') | is_number | float > 0 and
            states('sensor.box_ucrh_temperature') | is_number | float > 0
        }}  
      state: >
          {% set RH = states('sensor.box_ucrh_humidity') |float %}
          {% set temp = states('sensor.box_ucrh_temperature') |int %}
          {% set dewpoint = 243.04*(log(RH/100)+(17.625*temp/(243.04+temp)))
            /(17.625-log(RH/100)-(17.625*temp/(243.04+temp))) %}
          {{ dewpoint | float(20) | round(2) }}