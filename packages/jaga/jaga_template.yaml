  - sensor: 
      - name: "Jaga DBH fanspeed"
        unique_id: jaga_dbh_fanspeed
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:brightness-6
        # Tip: Haal de hashtag weg als je wilt dat de sensor 'unavailable' wordt als de groep uit staat
        # availability: >
        #   {{ is_state('fan.jaga_dbh_ventilatoren', 'on') }}
        state: >
          {% if is_state('fan.jaga_dbh_ventilatoren', 'on') %}
            {{ state_attr('fan.jaga_dbh_ventilatoren', 'percentage') | int(0) }}
          {% else %}
            0
          {% endif %}