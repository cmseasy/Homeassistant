                {% endif %}
                {% set ns_tom.items = ns_tom.items + [{'time': p.time, 'price': netto_price | round(5)}] %}
              {% endfor %}
            {% endif %}
            {{ ns_tom.items }}

      # ==========================================
      # 3. NETTO WASDROGER SENSOR
      # ==========================================
      - name: "Netto Droger Prijs per Kwartier"
        state: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        icon: "mdi:clock-check-outline"
        attributes:
          state_class: "measurement"
          prices_today: >
