- id: '1785594402653'
  alias: 'Jaga koelen: fan snelheid sturen op Delta T'
  description: Stuurt de Jaga DBH-ventilator aan op basis van het temperatuurverschil
    tussen de kamer en het water en bouwt in 1 uur af naar 0 als de compressor stopt.
  triggers:
  - entity_id: sensor.adlar_water_outlet_temp_t7
    trigger: state
    id: Verandering WP outlet temperatuur
  - entity_id: sensor.woonkamer_temperature
    trigger: state
    id: Verandering kamertemperatuur
  - trigger: state
    entity_id:
    - binary_sensor.adlar_compressor_active
    to:
    - 'off'
    id: WP compressor gestopt
  - trigger: state
    entity_id:
    - binary_sensor.adlar_compressor_active
    to:
    - 'on'
    for:
      hours: 0
      minutes: 1
      seconds: 0
    id: WP compressor gestart
  - event_type: timer.finished
    event_data:
      entity_id: timer.jaga_dbh_wachtijd_snelheid_afbouw
    id: Timer afbouw temperatuur
    trigger: event
  conditions:
  - condition: state
    entity_id: select.adlar_mode
    state:
    - Cooling
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Verandering WP outlet temperatuur
        - Verandering kamertemperatuur
        - WP compressor gestart
      - condition: state
        entity_id: binary_sensor.adlar_compressor_active
        state:
        - 'on'
      - condition: state
        entity_id: binary_sensor.wp_pomp_water_flow
        state: 'on'
      - condition: template
        value_template: '{% set t_kamer = states(''sensor.woonkamer_temperature'')
          | float(0) %}  {% set t_water = states(''sensor.adlar_water_outlet_temp_t7'')
          | float(0) %}  {{ (t_kamer - t_water) > 3 }}'
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.jaga_dbh_wachtijd_snelheid_afbouw
      - action: fan.turn_on
        target:
          entity_id: fan.jaga_dbh_ventilatoren
        data:
          percentage: '{% set t_kamer = states(''sensor.woonkamer_temperature'') |
            float(0) %} {% set t_water = states(''sensor.adlar_water_outlet_temp_t7'')
            | float(0) %} {% set delta_t = t_kamer - t_water %} {% if delta_t >= 10
            %} 100 {% elif delta_t <= 0 %} 0 {% else %} {{ (((delta_t / 10.0) * 100)
            / 10) | round(0) * 10 }} {% endif %}

            '
    - conditions:
      - condition: trigger
        id:
        - WP compressor gestopt
      sequence:
      - action: timer.start
        target:
          entity_id: timer.jaga_dbh_wachtijd_snelheid_afbouw
        data:
          duration: 00:10:00
    - conditions:
      - condition: trigger
        id:
        - Timer afbouw temperatuur
      sequence:
      - if:
        - condition: numeric_state
          entity_id: sensor.jaga_dbh_fanspeed
          above: 20
        then:
        - action: fan.decrease_speed
          target:
            entity_id: fan.jaga_dbh_ventilatoren
          data:
            percentage_step: 5
        - action: timer.start
          target:
            entity_id: timer.jaga_dbh_wachtijd_snelheid_afbouw
          data:
            duration: 00:10:00
        else:
        - action: fan.turn_off
          target:
            entity_id: fan.jaga_dbh_ventilatoren
        - action: timer.cancel
          target:
            entity_id: timer.jaga_dbh_wachtijd_snelheid_afbouw
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.adlar_compressor_active
          state:
          - 'off'
          - unavailable
          - unknown
          for:
            hours: 3
            minutes: 0
            seconds: 0
        - condition: not
          conditions:
          - condition: template
            value_template: '{% set t_kamer = states(''sensor.woonkamer_temperature'')
              | float(0) %}  {% set t_water = states(''sensor.adlar_water_outlet_temp_t7'')
              | float(0) %}  {{ (t_kamer - t_water) > 3 }}'
      - condition: state
        entity_id: binary_sensor.wp_pomp_water_flow
        state:
        - 'off'
        - unavailable
        - unknown
        for:
          hours: 3
          minutes: 0
          seconds: 0
        enabled: false
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.jaga_dbh_wachtijd_snelheid_afbouw
      - action: fan.turn_off
        target:
          entity_id: fan.jaga_dbh_ventilatoren
  mode: queued
  max: 10
- id: '1785615883219'
  alias: 'Jaga verwarmen: fan optimaliseren'
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.smart_thermostat_x_set_temperatuur
    for:
      hours: 0
      minutes: 0
      seconds: 10
  - trigger: state
    entity_id: sensor.smart_thermostat_x_temperatuur
  - trigger: state
    entity_id:
    - binary_sensor.adlar_system_oil_return
    to:
    - 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 10
  - trigger: state
    entity_id:
    - binary_sensor.adlar_defrost_running
    to:
    - 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 10
  conditions:
  - condition: switch.is_on
    target:
      entity_id: switch.adlar_main_switch
    options:
      behavior: any
      for:
        hours: 0
        minutes: 0
        seconds: 10
  - condition: state
    entity_id: select.adlar_mode
    state:
    - Heating
    for:
      hours: 0
      minutes: 0
      seconds: 10
  actions:
  - if:
    - condition: numeric_state
      entity_id: sensor.adlar_water_outlet_temp_t7
      above: sensor.smart_thermostat_x_temperatuur
    then:
    - action: fan.turn_on
      metadata: {}
      target:
        entity_id: fan.jaga_dbh_ventilatoren
      data: {}
    - action: fan.set_percentage
      metadata: {}
      target:
        entity_id: fan.jaga_dbh_ventilatoren
      data:
        percentage: "{% set setpoint = states('sensor.smart_thermostat_x_set_temperatuur')
          | float(20) %} {% set current = states('sensor.smart_thermostat_x_temperatuur')
          | float(20) %} {% set delta = setpoint - current %}\n{% set berekend_percentage
          = (delta / 1.5 * 100) | round(0) | int %}\n{% if berekend_percentage > 100
          %}\n  {{ 100 }}\n{% elif berekend_percentage <= 0 %}\n  {{ 0 }}\n{% else
          %}\n  {{ berekend_percentage }}\n{% endif %}"
    else:
    - action: fan.turn_off
      metadata: {}
      target:
        entity_id: fan.jaga_dbh_ventilatoren
      data: {}
      enabled: true
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.adlar_defrost_running
        state:
        - 'on'
      - condition: state
        entity_id: binary_sensor.adlar_system_oil_return
        state:
        - 'on'
      - condition: timer.is_active
        target:
          entity_id: timer.tijd_eco_na_defrost
        options:
          for: 00:00:00
      sequence:
      - action: fan.turn_off
        metadata: {}
        target:
          entity_id: fan.jaga_dbh_ventilatoren
        data: {}
    - conditions: []
      sequence: []
  mode: single
