- id: '1786347584780'
  alias: 'WP koelen: dauwpuntregeling (outlet)'
  description: ''
  triggers:
  - trigger: time_pattern
    minutes: /30
    id: periodiek
    enabled: true
  - trigger: state
    entity_id:
    - input_select.wp_selecteer_bedrijfsmodus
    to:
    - Auto koelen
    for:
      hours: 0
      minutes: 0
      seconds: 5
  - trigger: state
    entity_id:
    - binary_sensor.adlar_compressor_active
    from:
    - 'off'
    to:
    - 'on'
    id: Compressor gestart 10 sec geleden
    enabled: true
    for:
      hours: 0
      minutes: 0
      seconds: 10
  - trigger: state
    entity_id:
    - binary_sensor.adlar_compressor_active
    from:
    - 'off'
    to:
    - 'on'
    id: Compressor gestart 1 min geleden
    enabled: true
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - trigger: state
    entity_id:
    - binary_sensor.adlar_compressor_active
    from:
    - 'on'
    to:
    - 'off'
    id: Compressor gestopt
    enabled: true
    for:
      hours: 0
      minutes: 0
      seconds: 5
  - trigger: numeric_state
    entity_id:
    - sensor.adlar_water_outlet_temp_t7
    for:
      hours: 0
      minutes: 5
      seconds: 0
    below: sensor.dauwpunt_woonkamer
    id: Outlet temp < dauwpunt
  - entity_id:
    - sensor.dauwpunt_woonkamer
    for:
      hours: 0
      minutes: 0
      seconds: 1
    enabled: true
    from:
    to:
    trigger: state
    id: Dauwpunt
  - trigger: state
    entity_id:
    - sensor.adlar_water_outlet_temp_t7
    for:
      hours: 0
      minutes: 1
      seconds: 0
    from:
    to:
    enabled: true
    id: Outlet
  conditions:
  - condition: template
    value_template: "      {% if states.sensor.uptime is defined %}\n        {% set
      starttijd = states.sensor.uptime.last_updated %}\n        {{ (now() - starttijd).total_seconds()
      > 30 }}\n      {% else %}\n        false\n      {% endif %}"
    alias: HA uptime 30s
  - condition: state
    entity_id: switch.adlar_main_switch
    state:
    - 'on'
  - condition: state
    entity_id: select.adlar_mode
    state:
    - Cooling
  - condition: state
    entity_id: select.adlar_cooling_setting_curve
    state:
    - 'Off'
  - condition: state
    entity_id: timer.wachttijd_koelcurve_veranderen
    state: idle
  - condition: state
    entity_id: input_select.wp_selecteer_bedrijfsmodus
    state:
    - Auto koelen
  - condition: template
    value_template: '{{ is_state_attr(''switch.schedule_d94a8d'', ''current_slot'',
      none) }}'
    enabled: true
    alias: Scheduler vrijgave
  - condition: state
    entity_id: select.adlar_p116_regeling_in_of_outlet
    state:
    - Outlet
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - periodiek
        - Dauwpunt
        - Outlet
      - condition: numeric_state
        entity_id: sensor.kamertemperatuur_gemiddeld
        above: 23
      - condition: numeric_state
        entity_id: sensor.dauwpunt_woonkamer
        below: 20
        enabled: true
      - condition: state
        entity_id: switch.schedule_d94a8d
        state:
        - 'on'
      sequence:
      - repeat:
          while:
          - condition: state
            entity_id: binary_sensor.adlar_compressor_active
            state:
            - 'off'
            for:
              hours: 0
              minutes: 45
              seconds: 0
            enabled: false
          - alias: Compressor gedurende 45m niet aktief
            condition: template
            value_template: "{# Compressor is niet actief voor 45 minuten #}\n    {%
              if states('binary_sensor.adlar_compressor_active') == 'off' %}\n      {%
              set stoptijd = states.binary_sensor.adlar_compressor_active.last_changed
              %}\n      {# Bereken het verschil in minuten #}\n      {% set minuten_uit
              = (now() - stoptijd).total_seconds() / 60 %}\n      \n      {# Controleer
              of hij al 45 minuten of langer uitstaat #}\n      {{ minuten_uit >=
              45 }}\n    {% else %}\n      false\n    {% endif %}"
          - condition: numeric_state
            entity_id: sensor.adlar_water_outlet_temp_t7
            value_template: '{{ float(state.state) }}'
            above: sensor.dauwpunt_woonkamer
          - condition: state
            entity_id: timer.wachttijd_temp_set_veranderen
            state:
            - idle
          sequence:
          - action: number.set_value
            target:
              entity_id: number.adlar_temp_set_cooling
            data:
              value: "{% set dauwpunt = states('sensor.dauwpunt_woonkamer') | float(0)
                | round(0, 'ceil') %}\n{% set delta_t_aan = states('sensor.wp_aan_delta_t_temp_set')
                | float(0) | round(0, 'ceil') %}\n{% set doel_temp = (dauwpunt - (delta_t_aan
                | abs) - 1) | int %} \n{% set temp_set = states('number.adlar_temp_set_cooling')
                | int(0) %}\n{% if temp_set > doel_temp %}\n  {{ temp_set - 1 }}\n{%
                else %}\n  {{ temp_set }}\n{% endif %}"
          - action: logbook.log
            data:
              name: Adlar automation
              message: "{% set dauwpunt = states ('sensor.dauwpunt_woonkamer') | float(0)
                | round(0,'ceil') %}\n{% set temp_set = states('number.adlar_temp_set_cooling')
                | int(0) %} \nWp koelen (outlet) 1a: Temp set -1 van {{ temp_set }}
                naar {{ temp_set -1 }}, dauwpunt = {{ dauwpunt }}\n"
              entity_id: number.adlar_temp_set_cooling
            enabled: true
          - delay:
              hours: 0
              minutes: 4
              seconds: 0
              milliseconds: 0
            enabled: true
        enabled: true
      - if:
        - condition: template
          value_template: "{% set dauwpunt = states('sensor.dauwpunt_woonkamer') |
            float(0) | round(0, 'ceil') | int %}\n{% set temp_set = states('number.adlar_temp_set_cooling')
            | int(0) %} \n{% set max_temp_set = states('sensor.wp_max_temp_set_cooling')
            | int(0) %} \n{% set temp_buiten = states('sensor.buitentemperatuur_gemiddeld')
            | float(0) %}\n        \n{# 2. Bepaal het nieuwe setpoint #}\n{% set new
            = [dauwpunt, max_temp_set] | max | int %}\n{% set set = temp_set | int
            %} \n{% set hys = 1 %}\n        \n{# 3. De voorwaarde geeft TRUE of FALSE
            terug aan de IF #} \n{{ (new > set) or (new < set and (set - new) >= hys)
            }}"
        then:
        - action: number.set_value
          target:
            entity_id: number.adlar_temp_set_cooling
          data:
            value: "{% set dauwpunt = states('sensor.dauwpunt_woonkamer') | float(0)
              | round(0, 'ceil') | int %}\n{% set temp_set = states('number.adlar_temp_set_cooling')
              | int(0) %}\n{% set max_temp_set = states('sensor.wp_max_temp_set_cooling')
              | int(0) %} \n\n{# 2. Bepaal het potentiële nieuwe setpoint (n) en het
              huidige setpoint (t) #}\n{% set new = [dauwpunt, max_temp_set] | max
              | int %}\n{% set now = temp_set | int %}\n{% set hys = 1 %}     \n\n{#
              3. Controleer de hysterese. Indien WAAR: stuur 'n', indien ONWAAR: stuur
              huidige 't' #}\n{{ new if (new > now) or (new < now and (now - new)
              >= hys) else now }}"
          enabled: true
        - action: logbook.log
          data:
            name: Adlar automation
            message: "{% set dauwpunt = states ('sensor.dauwpunt_woonkamer') | float(0)
              | round(0,'ceil') %}\n{% set temp_set = states('number.adlar_temp_set_cooling')
              | int(0) %}\nWp koelen (outlet) 1b dauwpunt temp set: van {{ temp_set
              }} naar {{ dauwpunt + 0 }} \n"
            entity_id: number.adlar_temp_set_cooling
          enabled: true
        - action: timer.start
          metadata: {}
          data:
            duration:
              hours: 0
              minutes: 2
              seconds: 0
          target:
            entity_id: timer.wachttijd_temp_set_veranderen
          enabled: true
        enabled: true
    - conditions:
      - condition: trigger
        id:
        - Compressor gestart 1 min geleden
      sequence:
      - if:
        - condition: template
          value_template: "{% set dauwpunt = states('sensor.dauwpunt_woonkamer') |
            float(0) | round(0, 'ceil') | int %}\n{% set temp_set = states('number.adlar_temp_set_cooling')
            | int(0) %}\n{% set max_temp_set = states('sensor.wp_max_temp_set_cooling')
            | int(0) %} \n{% set temp_buiten = states('sensor.buitentemperatuur_gemiddeld')
            | float(0) %}\n        \n{# 2. Bepaal het nieuwe setpoint #}\n{% set n
            = [dauwpunt, max_temp_set] | max | int %}\n{% set t = temp_set | int %}\n{%
            set h = 1 %}\n    \n{# 3. De voorwaarde geeft TRUE of FALSE terug aan
            de IF #}\n{{ (n > t) or (n < t and (t - n) >= h) }}"
        then:
        - action: number.set_value
          target:
            entity_id: number.adlar_temp_set_cooling
          data:
            value: "{% set dauwpunt = states('sensor.dauwpunt_woonkamer') | float(0)
              | round(0, 'ceil') | int %}\n{% set t = states('number.adlar_temp_set_cooling')
              | int(0) %}\n{% set max_temp_set = states('sensor.wp_max_temp_set_cooling')
              | int(0) %} \n{% set tb = states('sensor.buitentemperatuur_gemiddeld')
              | float(0) %}\n      \n{# 2. Bepaal het potentieel nieuwe setpoint (n)
              #}\n{% set n = [dauwpunt + 1, max_temp_set] | max | int %}\n      \n{#
              3. Controleer de hysterese-voorwaarde. Indien WAAR: stuur 'n', indien
              ONWAAR: behoud huidige 't' #}\n{{ n if (n > t) or (n < t and (t - n)
              >= 1) else t }}"
        - action: timer.start
          metadata: {}
          data:
            duration:
              hours: 0
              minutes: 10
              seconds: 0
          target:
            entity_id: timer.wachttijd_temp_set_veranderen
          enabled: true
        - action: logbook.log
          data:
            name: Adlar automation
            message: "% set dauwpunt = states ('sensor.dauwpunt_woonkamer') | float(0)
              | round(0,'ceil') %}\n{% set temp_set = states('number.adlar_temp_set_cooling')
              | int(0) %}\nWp koelen (outlet) 2 temp set: van {{ temp_set }} naar
              {{ dauwpunt + 1 }} \n"
            entity_id: number.adlar_temp_set_cooling
          enabled: true
      - alias: Temp set bij start kouderegeling
        target:
          entity_id: number.adlar_temp_set_cooling
        data:
          value: "{% set dauwpunt = states('sensor.dauwpunt_woonkamer') | float(0)
            | round(0, 'ceil') %} {% set temp_set = states('number.adlar_temp_set_cooling')
            | int(0) %}  {% if temp_set != dauwpunt %} {{ [dauwpunt + 0, 15] | max
            }} {% else %}\n  {{ temp_set }}\n{% endif %}\n"
        action: number.set_value
        enabled: false
    - conditions:
      - condition: trigger
        id:
        - Outlet temp < dauwpunt
      - condition: state
        entity_id: binary_sensor.adlar_compressor_active
        state:
        - 'on'
      - condition: state
        entity_id: timer.wachttijd_temp_set_veranderen
        state:
        - idle
      - condition: numeric_state
        entity_id: sensor.wp_delta_t
        below: -2
      - condition: numeric_state
        entity_id: sensor.adlar_compressor_running_frequency
        above: 29
        enabled: true
        below: 35
      - condition: numeric_state
        entity_id: sensor.adlar_water_outlet_temp_t7
        below: sensor.dauwpunt_woonkamer
        enabled: false
      sequence:
      - alias: Temp set bij start kouderegeling
        target:
          entity_id: number.adlar_temp_set_cooling
        data:
          value: '{% set temp_set = states(''number.adlar_temp_set_cooling'') | int(0)
            %}

            {{ [temp_set + 1, 15] | max }}'
        action: number.set_value
        enabled: true
      - delay:
          hours: 0
          minutes: 0
          seconds: 20
          milliseconds: 0
        enabled: false
      - action: timer.start
        metadata: {}
        target:
          entity_id: timer.wachttijd_temp_set_veranderen
        data:
          duration:
            hours: 0
            minutes: 10
            seconds: 0
        enabled: true
      - action: logbook.log
        metadata: {}
        data:
          name: Adlar automation
          entity_id: number.adlar_temp_set_cooling
          message: '{% set delta_t_stop = states(''sensor.wp_delta_t_bij_stop'') |
            int(0) %}

            {% set p26 = states(''sensor.adlar_p26_hysterese_watertemperatuur_start_warmtepomp'')
            | int(0) %}

            {% set dauwpunt = states (''sensor.dauwpunt_woonkamer'') | float(0) |
            round(0,''ceil'') %}

            {% set temp_set = states(''number.adlar_temp_set_cooling'') | int(0) %}

            {% set outlet = states (''sensor.adlar_water_outlet_temp_t7'') | int(0)
            %}

            Wp koelen (outlet) 3 temp set: van {{ temp_set }} naar {{ temp_set + 1
            }} '
        enabled: true
    - conditions:
      - condition: state
        entity_id: switch.adlar_main_switch
        state:
        - 'off'
      - condition: numeric_state
        entity_id: sensor.adlar_water_outlet_temp_t7
        value_template: '{{ float(state.state, 0) - 2 }}'
        enabled: true
        above: sensor.dauwpunt_woonkamer
      - condition: state
        entity_id: binary_sensor.adlar_compressor_active
        state:
        - 'on'
        for:
          hours: 0
          minutes: 5
          seconds: 0
      - condition: state
        entity_id: timer.wachttijd_temp_set_veranderen
        state:
        - idle
      sequence:
      - alias: Temp set bij start kouderegeling
        target:
          entity_id: number.adlar_temp_set_cooling
        data:
          value: '{{((states (''number.adlar_temp_set_cooling'') | int(0) - 1), 17)
            | max }}'
        action: number.set_value
        enabled: false
      - action: logbook.log
        metadata: {}
        data:
          name: Adlar automation
          entity_id: number.adlar_temp_set_cooling
          message: 'WP kouderegeling dauwpunt (outlet) - optie 4, temp set: {{ states(''number.adlar_temp_set_cooling'')
            }} - 1'
        enabled: false
      - action: timer.start
        metadata: {}
        target:
          entity_id: timer.wachttijd_temp_set_veranderen
        data:
          duration:
            hours: 0
            minutes: 10
            seconds: 0
        enabled: false
    - conditions:
      - condition: template
        value_template: '{% set dauwpunt = states(''sensor.dauwpunt_woonkamer'') |
          float(0) | round(0, ''ceil'') %}

          {% set delta_t_aan = states(''sensor.wp_aan_delta_t_temp_set'') | float(0)
          | round(0, ''ceil'') %}

          {% set doel_temp = (dauwpunt - (delta_t_aan | abs) - 1) | int %}

          {{ states(''number.adlar_temp_set_cooling'') | int(0) != doel_temp }}'
        enabled: false
      - condition: trigger
        id:
        - Compressor gestopt
      sequence:
      - alias: Temp set bij start kouderegeling
        target:
          entity_id: number.adlar_temp_set_cooling
        data:
          value: "{% set delta_t_stop = states('sensor.wp_delta_t_bij_stop') | int(0)
            %}\n{% set p26 = states('sensor.adlar_p26_hysterese_watertemperatuur_start_warmtepomp')
            | int(0) %}\n{% set dauwpunt = states ('sensor.dauwpunt_woonkamer') |
            float(0) | round(0,'ceil') %}\n{% set temp_set = states('number.adlar_temp_set_cooling')
            | int(0) %}\n{% set outlet = states ('sensor.adlar_water_outlet_temp_t7')
            | int(0) %}\n{% set delta_t_aan = states ('sensor.wp_aan_delta_t_temp_set')
            | float(0) | round(0,'ceil') %}\n{# Als het verschil kleiner is dan 0,
            laat dan de delta zien, anders 0 #}\n{% if dauwpunt - (delta_t_aan | abs)
            - 1 != temp_set  %}\n  {{ dauwpunt - (delta_t_aan | abs) - 1 }}\n{#% else
            %#}\n{% endif %}\n"
        action: number.set_value
        enabled: false
      - action: logbook.log
        data:
          name: Adlar automation
          message: "{% set dauwpunt = states ('sensor.dauwpunt_woonkamer') | float(0)
            | round(0,'ceil') %}\n{% set temp_set = states('number.adlar_temp_set_cooling')
            | int(0) %}\n{% set outlet = states ('sensor.adlar_water_outlet_temp_t7')
            | int(0) %}\n{% set delta_t_aan = states ('sensor.wp_aan_delta_t_temp_set')
            | float(0) | round(0,'ceil') %}\nWp koelen (outlet) 5  Compressor gestopt,
            Temp set {{ temp_set }} \n\n"
          entity_id: number.adlar_temp_set_cooling
        enabled: true
  mode: single
- id: '1787080496246'
  alias: 'Melding: ESP loopt vast of offline'
  description: Stuurt een melding als de uptime sensor niet meer update of offline
    is
  triggers:
  - entity_id:
    - sensor.adlar_modbus_esp_uptime
    - sensor.modbus_duco_esp_uptime
    for:
      minutes: 5
    trigger: state
    not_to:
    - unavailable
    - unknown
  conditions: []
  actions:
