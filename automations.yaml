      entity_id: sensor.afvalwijzer_today
      state: unavailable
    - condition: state
      entity_id: sensor.afvalwijzer_today
      state: geen
    enabled: false
  - condition: state
    entity_id: sensor.uptime
    state:
    - uptime
    for:
      hours: 0
      minutes: 0
      seconds: 30
    attribute: device_class
  actions:
  - data:
      title: Afval
      message: 'vandaag: {{ states(''sensor.afvalwijzer_today'') }}'
      data:
        channel: Stil
    enabled: true
    action: notify.mobile_app_gsm_martin
  - data:
      title: Afval
      message: 'vandaag: {{ states(''sensor.afvalwijzer_today'') }}'
      data:
        channel: Stil
    enabled: false
    action: notify.mobile_app_gsm_marjan
  mode: single
