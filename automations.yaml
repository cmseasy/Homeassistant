- id: '1761382213410'
  alias: 'WP AV: optimale temp set'
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.adlar_compressor_active
    to:
    - 'off'
    from:
    - 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: Compressor stopt
    enabled: true
  - trigger: state
    entity_id:
    - binary_sensor.adlar_compressor_active
    to:
    - 'on'
    from:
    - 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: Compressor start
    enabled: true
  - trigger: state
    entity_id:
    - sensor.kamertemperatuur_waardering
    from:
    - Te koud
    to:
    - Ok
    id: kamertemperatuur ok
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - trigger: state
    entity_id:
    - sensor.kamertemperatuur_waardering
    from:
    - Ok
    to:
    - Te warm
    id: kamertemperatuur te warm
    for:
      hours: 0
      minutes: 1
      seconds: 0
  conditions:
  - condition: state
    entity_id: binary_sensor.192_168_1_130
    state:
    - 'on'
  - condition: state
    entity_id: switch.adlar_main_switch
    state:
    - 'on'
  - condition: state
    entity_id: binary_sensor.adlar_defrost_running
    state:
    - 'off'
    for:
      hours: 0
      minutes: 30
      seconds: 0
  - condition: state
    entity_id: binary_sensor.adlar_system_oil_return
    state:
    - 'off'
    for:
      hours: 0
      minutes: 10
      seconds: 0
  - condition: state
    entity_id: input_select.wp_selecteer_bedrijfsmodus
    state: Auto verwarmen
    enabled: true
  - condition: numeric_state
    entity_id: climate.smart_thermostat_x
    attribute: temperature
    above: 20
  - condition: state
    entity_id: binary_sensor.adlar_defrost_running
    state:
    - 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    enabled: false
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Compressor stopt
      - condition: state
        entity_id: sensor.kamertemperatuur_waardering
        state: Te koud
      sequence:
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{% set current_temp = states(''sensor.water_temperature_controlled'')
            | int %}

            {{ current_temp + 1 }}

            '
        target:
          entity_id: input_number.wp_berekende_optimale_temp_set
      - action: logbook.log
        metadata: {}
        data:
          entity_id: input_number.wp_berekende_optimale_temp_set
          name: Adlar automation
          message: 'WP Opt temp set: optie 1'
      alias: Compressor stopt en kamertemperatuur te koud
    - conditions:
      - condition: trigger
        id:
        - Compressor stopt
      - condition: state
        entity_id: sensor.kamertemperatuur_waardering
        state: Te warm
        for:
          hours: 0
          minutes: 10
          seconds: 0
      - condition: state
        entity_id: sensor.kamertemperatuur_verandering
        for:
          hours: 0
          minutes: 10
          seconds: 0
        state: Stijgt
      sequence:
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{% set current_temp = states(''sensor.water_temperature_controlled'')
            | int %}

            {{ current_temp - 1 }}

            '
        target:
          entity_id: input_number.wp_berekende_optimale_temp_set
      - action: logbook.log
        metadata: {}
        data:
          entity_id: input_number.wp_berekende_optimale_temp_set
          name: Adlar automation
          message: 'WP Opt temp set: optie 2'
      alias: Compressor stopt en kamertemperatuur te warm en stijgt
    - conditions:
      - condition: trigger
        id:
        - kamertemperatuur ok
      sequence:
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{% set current_temp = states(''sensor.water_temperature_controlled'')
            | int %}

            {{ current_temp }}

            '
        target:
          entity_id: input_number.wp_berekende_optimale_temp_set
        enabled: false
      - action: logbook.log
        metadata: {}
        data:
          entity_id: input_number.wp_berekende_optimale_temp_set
          name: Adlar automation
          message: 'WP Opt temp set: optie 3'
        enabled: false
      alias: Kamertemperatuur is ok
    - conditions:
      - condition: trigger
        id:
        - kamertemperatuur te warm
      sequence:
      - action: input_number.set_value
        metadata: {}
        data:
          value: '{% set current_temp = states(''sensor.water_temperature_controlled'')
            | int %}

            {{ current_temp - 1 }}

            '
        target:
          entity_id: input_number.wp_berekende_optimale_temp_set
        enabled: false
      - action: logbook.log
        metadata: {}
        data:
          entity_id: input_number.wp_berekende_optimale_temp_set
          name: Adlar automation
          message: 'WP Opt temp set: optie 4'
        enabled: false
      alias: Kamertemperatuur is te warm
  mode: single
