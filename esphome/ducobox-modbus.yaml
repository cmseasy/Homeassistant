  - platform: homeassistant
    name: "Luchtvochtigheid Smart X (HA)"
    entity_id: sensor.smart_thermostat_x_luchtvochtigheid
    id: rh_smart_x_ha
    internal: true # Hiermee voorkom je dat de sensor dubbel in Home Assistant verschijnt
    unit_of_measurement: "%"
    state_class: "measurement"  
