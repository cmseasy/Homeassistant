substitutions:
  modbus_tx_pin: GPIO17 #GPIO17   # Verbind met DI op de MAX485 module
  modbus_rx_pin: GPIO16 #GPIO16   # Verbind met RO op de MAX485 module
  
esphome:
  min_version: 2025.12.0
  name: ducobox-modbus
  friendly_name: Ducobox modbus
  name_add_mac_suffix: false

  on_boot:
    priority: -100.0 # Dit start pas als de basistaken draaien
    then:
      - delay: 75s   # Wacht 75 seconden (dus tot ná de 60s boot-loop reset en sensor polls)
      # - globals.set:
      #     id: wtw_systeem_volledig_online
      #     value: 'true'
      - lambda: |-
          // Schakel de handmatige modus geforceerd UIT
          id(wtw_handmatig_actief).publish_state(false);
          
          // Reset ook direct de berekende doel-sensor naar de veilige basiswaarde
          id(rh_berekend_doel).publish_state(55.0);
          
          ESP_LOGI("main", "WTW RH Regeling is gestart in AUTOMATISCHE modus.");
      - globals.set:
          id: wtw_systeem_volledig_online
          value: 'true'


esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
      compiler_optimization: PERF

# Verbind met uw Wi-Fi netwerk
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  manual_ip:
    static_ip: 192.168.1.119
    gateway: 192.168.1.1
    dns1: 192.168.1.5 
    subnet: 255.255.255.0
  ap:
    ssid: !secret duco_modbus_wifi_ap_ssid
    password: !secret duco_modbus_wifi_ap_password

# Enable logging
logger:
  level: INFO 
  baud_rate: 0

  on_message:
    - level: ERROR
      then:
        - homeassistant.event:
            event: esphome.log_message
            data:
              level: ERROR
              device: "ducobox-modbus"
              tag: !lambda "return tag;"
              message: !lambda "return message;"




  

# Enable Home Assistant API
api:
  port: 6053
  encryption:
    key: !secret duco_modbus_encryption_key

# Allow Over-The-Air updates
ota:
- platform: esphome
  password: !secret duco_modbus_ota_pass

time:
  - platform: homeassistant
    id: homeassistant_time

captive_portal:

web_server:
  port: 80
  version: 3
  local: True
  include_internal: True
  # auth:
  #   username: !secret web_server_username
  #   password: !secret web_server_password
  sorting_groups:
    - id: sorting_group_configuration_setup
      name: "Configuration setup"
      sorting_weight: 10
    - id: sorting_group_timers
      name: "Timers"
      sorting_weight: 5
  
# 1. Seriële poort opzetten naar de MAX485 converter
uart:
  - id: modbus_uart
    tx_pin: ${modbus_tx_pin} #GPIO17   # Verbind met DI op de MAX485 module
    rx_pin: ${modbus_rx_pin} #GPIO16   # Verbind met RO op de MAX485 module
    baud_rate: 9600  #9600  # Duco standaard baudrate (soms 19200)
    data_bits: 8
    stop_bits: 1
    parity: NONE
    rx_full_threshold: 1 # Helpt om de buffer direct te legen en timeouts 

# 2. De basis Modbus-bus configureren
modbus:
  - uart_id: modbus_uart
    id: modbus_client
    send_wait_time: 500ms
    turnaround_time: 100ms

# 3. De Modbus Controller koppelen aan het Duco Slave adres
modbus_controller:
  - id: duco_box
    modbus_id: modbus_client
    address: 1
    update_interval: 30s


globals:
  # 15 minuten wachttijd na setpoint verandering
  - id: wtw_cooldown_actief
    type: bool
    restore_value: no
    initial_value: 'false'
  # Vrijgeven berekening na upload of herstart ESP
  - id: wtw_systeem_volledig_online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: last_manual_setpoint_change
    type: uint32_t
    initial_value: '0'

  # # NIEUW: Hierin slaan we het rh_berekende doel (55, 60, 65, etc.) tijdelijk op
  # - id: rh_berekend_doel
  #   type: int
  #   restore_value: no
  #   initial_value: '55'
  # # Douche is actief
  # - id: wtw_douche_actief_vlag
  #   type: bool
  #   restore_value: no
  #   initial_value: 'false'
# Vergeet niet om deze twee variabelen toe te voegen aan je 'globals:' sectie bovenin je YAML:

  - id: start_verificatie_tijd
    type: uint32_t
    initial_value: '0'
  - id: start_cooldown_tijd
    type: uint32_t
    initial_value: '0'
  # - id: start_log_geprint
  #   type: bool
  #   initial_value: 'false'
  - id: vorige_rh_setpoint
    type: int
    restore_value: no
    initial_value: '0'

              
# 4. Entiteiten aanmaken om uit te lezen (Snsoren)
button:
  - platform: restart
    name: "Restart ESP"
    icon: "mdi:restart"
    web_server:
      sorting_group_id: sorting_group_configuration_setup
      sorting_weight: 001

  - platform: template
    name: "Handmatige Modus Annuleren"
    icon: "mdi:restart"
    on_press:
      then:
        - lambda: |-
            id(wtw_handmatig_actief).publish_state(false);
            ESP_LOGI("main", "Handmatig modus is geannuleerd. Terug naar automatisch bedrijf.");
    web_server:
      sorting_group_id: sorting_group_configuration_setup
      sorting_weight: 002


switch:
  - platform: template
    name: "RH setpoint regeling (aan-uit)"
    id: switch_rh_regeling
    icon: "mdi:power-cycle"
    optimistic: true
    restore_mode: ALWAYS_ON #RESTORE_INVERTED_DEFAULT_ON
    web_server:
      sorting_group_id: sorting_group_configuration_setup
      sorting_weight: 000


