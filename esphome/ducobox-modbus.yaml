# 1. Verwijder het 'platform: modbus_controller' deel voor nummer 582
# 2. Maak in plaats daarvan een template number aan:
number:
  - platform: modbus_controller
    modbus_controller_id: duco_box
    name: "WTW RH setpoint"
    id: rh_setpoint
    icon: "mdi:water-percent"
    register_type: holding
    address: 582
    device_class: humidity
    value_type: S_WORD
    min_value: 0
    max_value: 100
    step: 5
    mode: box
    unit_of_measurement: "%"
    disabled_by_default: false
    force_new_range: true 
    
    on_value:
      then:
        - lambda: |-
            // 1. BLOKKEER TIJDENS BOOT EN NEGEER INCORRECTE NULLEN/NAN
            if (std::isnan(x) || !id(wtw_systeem_volledig_online)) {
              return; 
            }

            int binnenkomende_waarde = (int)x;
            int berekend_doel = (int)id(rh_berekend_doel).state;
            int vorige_waarde = id(vorige_rh_setpoint);

            // CRUCIALE BOOT-FIX: Als de vorige waarde nog 0 is, is dit de allereerste poll na de upload.
            // Sla de waarde op, maar activeer NOOIT de handmatige modus.
            if (vorige_waarde == 0) {
              id(vorige_rh_setpoint) = binnenkomende_waarde;
              ESP_LOGI("main", "Eerste Modbus-poll succesvol verwerkt na boot. Systeem blijft in AUTOMATISCHE modus.\nDe RH regeling begint met een RH setpoint van %d%%.", binnenkomende_waarde);

              return;
            }

            // Sla de nieuwe waarde op voor de volgende poll
            id(vorige_rh_setpoint) = binnenkomende_waarde;

            // 2. Als de waarde exact gelijk is aan de vorige keer, doe niets
            if (binnenkomende_waarde == vorige_waarde) {
              return;
            }

            // 3. Negeer automatische updates van onze eigen reguliere scripts
            if (binnenkomende_waarde == berekend_doel) {
              ESP_LOGI("main", "Automatische HR setpoint update naar %d%%.", binnenkomende_waarde);
              return;
            }

            // --- CRUCIALE BLOKKADE: Fantoom handmatige modus voorkomen ---
            // Als de douche actief is, of Modus 3 regelt net de afloop in, negeer Modbus register-kruisingen
            if (id(wtw_douche_actief).state) {
              ESP_LOGD("main", "Modbus wijziging genegeerd: Douche-afwikkeling is actief.");
              return;
            }

            // 4. Als de handmatige modus al actief is, negeer dan de Modbus-echo's
            if (id(wtw_handmatig_actief).state) {
              return;
            }

            // 5. De gebruiker verandert ZELF de waarde via de UI -> Naar handmatig forceren!
            id(wtw_rh_regeling).stop();
            id(wtw_modus_normaal).stop();

            // Activeer de handmatige modus direct
            id(wtw_handmatig_actief).publish_state(true);
            ESP_LOGI("main", "Handmatige modus door gebruiker! Van %d%% naar %d%%.", vorige_waarde, binnenkomende_waarde);

    web_server:
      sorting_group_id: sorting_group_configuration_setup
      sorting_weight: 5

