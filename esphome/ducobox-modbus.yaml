# Duco WTW RH regeling, zorgt dat het RH setpoint van de Duco boven de RH van de woonkamer blijft
# waardoor de WTW niet onnodig optoerd.
# Benodigd: matterjs-server (Proxmox), gekoppeld aan de Tado X voor de woonkamer RH waarde
#           het bestand websocket_client.h voor de connectie met de matterjs_server
#           en/of Homeassistant met deze woonkamer RH sensor

substitutions:
  modbus_tx_pin: GPIO17 #GPIO17   # Verbind met DI op de MAX485 module
  modbus_rx_pin: GPIO16 #GPIO16   # Verbind met RO op de MAX485 module

# EERST DE VEILIGHEIDSINSTELLINGEN
safe_mode:
  boot_is_good_after: 10s   # Vertel de safe_mode na 10s al dat de boot succesvol was
  num_attempts: 10    

esphome:
  min_version: 2025.12.0
  name: ducobox-modbus
  friendly_name: Ducobox modbus
  name_add_mac_suffix: false
 
  # matterjs.server 
  includes:
    - websocket_client.h 

  on_boot:
    #priority: -100.0
    #matter
    priority: 200.0
    then:
      - lambda: ESP_LOGI("main", "Wachten op geldige Modbus sensorwaarden...");
      
      # De officiële ingebouwde ESPHome methode voor een timeout:
      - wait_until:
          condition:
            lambda: return !isnan(id(rh_actual_active).state);
          # Als het langer dan 30 seconden duurt, breekt ESPHome de wachtstand zelf af:
          timeout: 30s
      
      - delay: 1s             # Heel even ademruimte om alle modbus registers te vullen
      
      - lambda: |-
          id(wtw_handmatig_actief).publish_state(false);
          id(rh_berekend_doel).publish_state(55.0);
          ESP_LOGI("main", "WTW RH Regeling is gestart in AUTOMATISCHE modus.");
      
      # 1. Systeem is nu echt bruikbaar en online
      - globals.set:
          id: wtw_systeem_volledig_online
          value: 'true'
  
      # 2. Dwing het hoofdscript om NU direct te starten
      - script.execute: wtw_rh_regeling
        
      # matterjs.server 
      - lambda: |-
          id(global_ws_client) = (void*) new MyWebsocketComponent();
          ((MyWebsocketComponent*)id(global_ws_client))->setup();

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
      compiler_optimization: PERF

    # matterjs.server   
    components:
    - name: "espressif/esp_websocket_client"
      ref: 1.5.0

# Dit activeert het automatische knipperen bij storingen
status_led:
  pin: GPIO2  # GPIO2 is de ingebouwde blauwe LED op de esp32dev
      
# Verbind met uw Wi-Fi netwerk
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  manual_ip:
    static_ip: 192.168.1.119
    gateway: 192.168.1.1
    dns1: 192.168.1.5 
    subnet: 255.255.255.0
  # on_connect:
  #   then:
  #     - lambda: |-
  #         if (id(global_ws_client) == nullptr) {
  #           id(global_ws_client) = (void*) new MyWebsocketComponent();
  #           ((MyWebsocketComponent*)id(global_ws_client))->setup();
  #         }
  ap:
    ssid: !secret duco_modbus_wifi_ap_ssid
    password: !secret duco_modbus_wifi_ap_password

# Enable logging
logger:
  level: INFO 
  baud_rate: 0
  on_message:
    - level: ERROR
      then:
        - homeassistant.event:
            event: esphome.log_message
            data:
              level: ERROR
              device: "ducobox-modbus"
              tag: !lambda "return tag;"
              message: !lambda "return message;"

# logger:
#   level: VERY_VERBOSE
#   logs:
#     # We zetten de modbus-onderdelen op het meest gedetailleerde niveau:
#     modbus: VERY_VERBOSE
#     modbus_controller: VERY_VERBOSE
    
#     # Dit voorkomt dat de rest van de ESP32 uw logscherm overspoelt:
#     api: DEBUG
#     wifi: DEBUG
#     component: DEBUG

# Enable Home Assistant API
api:
  port: 6053
  encryption:
    key: !secret duco_modbus_encryption_key

# Allow Over-The-Air updates
ota:
- platform: esphome
  password: !secret duco_modbus_ota_pass

time:
  - platform: homeassistant
    id: homeassistant_time

captive_portal:

web_server:
  port: 80
  version: 3
  local: True
  include_internal: True
  # auth:
  #   username: !secret web_server_username
  #   password: !secret web_server_password
  sorting_groups:
    - id: sorting_group_configuration_setup
      name: "Configuration setup"
      sorting_weight: 10
    - id: sorting_group_timers
      name: "Timers"
      sorting_weight: 5
  
# 1. Seriële poort opzetten naar de MAX485 converter
uart:
  - id: modbus_uart
    tx_pin: ${modbus_tx_pin} #GPIO17   # Verbind met DI op de MAX485 module
    rx_pin: ${modbus_rx_pin} #GPIO16   # Verbind met RO op de MAX485 module
    baud_rate: 9600  #9600  # Duco standaard baudrate (soms 19200)
    data_bits: 8
    stop_bits: 1
    parity: NONE
    rx_full_threshold: 1 # Helpt om de buffer direct te legen en timeouts 

# 2. De basis Modbus-bus configureren
modbus:
  - uart_id: modbus_uart
    id: modbus_hub
    send_wait_time: 500ms
    turnaround_time: 200ms 

# 3. De Modbus Controller koppelen aan het Duco Slave adres
modbus_controller:
  - id: modbus_duco
    modbus_id: modbus_hub
    address: 1
    update_interval: 11s # 11 is priemgetal30s
    max_cmd_retries: 2

  - id: modbus_duco_traag
    modbus_id: modbus_hub
    address: 1
    update_interval: 59s # Een priemgetal (~1 min) zodat hij bijna nooit tegelijk start met de 11s cyclus
                         # matterjs-server interval staat op 61s, beide priemgetallen
    # command_throttle: 293ms  # Verhoogd: geef de warmtepomp 300ms ademruimte tussen registers
    setup_priority: -110
    max_cmd_retries: 2
        
  - id: modbus_duco_statisch # voor bv setpoints die niet vaak veranderen
    modbus_id: modbus_hub
    address: 1
    update_interval: 599s  # Ongeveer 10min en een priemgetal
    # command_throttle: 300ms  # Verhoogd: geef de warmtepomp 300ms ademruimte tussen registers
    setup_priority: -120
    max_cmd_retries: 2

# Glabale variabelen  
globals:
  # Vrijgeven berekening na upload of herstart ESP
  - id: wtw_systeem_volledig_online
    type: bool
    restore_value: no
    initial_value: 'false'
  # Zorgt voor directe Modbus-verzending bij de allereerste berekening
  - id: wtw_eerste_berekening_na_boot
    type: bool
    restore_value: no
    initial_value: 'true'
  # 15 minuten wachttijd na setpoint verandering
  - id: wtw_cooldown_actief
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: last_manual_setpoint_change
    type: uint32_t
    initial_value: '0'
  - id: start_verificatie_tijd
    type: uint32_t
    initial_value: '0'
  - id: start_cooldown_tijd
    type: uint32_t
    initial_value: '0'
  - id: vorige_rh_setpoint
    type: int
    restore_value: no
    initial_value: '0'
  - id: global_douche_vorige_status
    type: bool
    restore_value: no
    initial_value: 'false'
 # Douchetijd
  - id: start_douche_tijd
    type: unsigned long
    restore_value: no
    initial_value: '0'
  # matterjs.server 
  - id: global_ws_client
    type: void*
    initial_value: 'nullptr'

# 4. Entiteiten aanmaken om uit te lezen (Snsoren)
button:
  - platform: restart
    name: "Restart ESP"
    icon: "mdi:restart"
    web_server:
      sorting_group_id: sorting_group_configuration_setup
      sorting_weight: 001

  - platform: template
    name: "Handmatige Modus Annuleren"
    icon: "mdi:restart"
    on_press:
      then:
        - lambda: |-
            id(wtw_handmatig_actief).publish_state(false);
            ESP_LOGI("main", "Handmatig modus is geannuleerd. Terug naar automatisch bedrijf.");
    web_server:
      sorting_group_id: sorting_group_configuration_setup
      sorting_weight: 002

switch:
  - platform: template
    name: "RH setpoint regeling (aan-uit)"
    id: switch_rh_regeling
    icon: "mdi:power-cycle"
    optimistic: true
    restore_mode: ALWAYS_ON #RESTORE_INVERTED_DEFAULT_ON
    web_server:
      sorting_group_id: sorting_group_configuration_setup
      sorting_weight: 000

