# ==============================================================================
# Modbus - Ducobox RH Reletieve vochtigheid
# ==============================================================================
        
# Node 58: RH box
  - platform: modbus_controller
    modbus_controller_id: modbus_duco
    name: "Ducobox RH gemeten"
    id: ducobox_rh_actual
    icon: "mdi:water-percent"
    register_type: read
    address: 585
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: "measurement"
    device_class: humidity
    accuracy_decimals: 1
    internal: true
    filters:
      - lambda: |-
          if (std::isnan(x) || x == 0) return NAN;
          return x / 100.0 * 1.00;  // factor 10.5 is het verschil tussen RH thermostaat en RH box, thermosstaat leiden
    on_value:
      then:
        - component.update: ducobox_rh_filtered



# Node 58: RH box gefilterd om pieken van douche en quooker weg te halen
  - platform: template
    name: "Ducobox RH gemeten en gefiltert"
    id: ducobox_rh_filtered
    unit_of_measurement: "%"
    state_class: "measurement"
    device_class: humidity
    accuracy_decimals: 1
    icon: "mdi:water-percent"
    update_interval: never
    disabled_by_default: true
    filters:
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 1
    lambda: |-
      // 1. Controleer of de hoofd-sensor wel online is
      if (!id(ducobox_rh_actual).has_state()) {
        return NAN;
      }

      // 2. Haal de nieuwe waarde op
      float x = id(ducobox_rh_actual).state;
      
      // 3. Onthoud de vorige geldige waarde
      static float vorige_rh = NAN;
      
      // Eerste keer opstarten? Accepteer de waarde.
      if (std::isnan(vorige_rh)) {
        vorige_rh = x;
        return x;
      }
      
      float verschil = std::abs(x - vorige_rh);
      float max_verandering = 1.2; 
      
      // 4. Filter de snelle pieken eruit
      if (verschil > max_verandering) {
        return vorige_rh; // Negeer de piek en geef de oude waarde terug
      } else {
        vorige_rh = x;    // Accepteer de trage verandering
        return x;
      }
    on_value:
      then:
        - component.update: rh_actual_active










# sensor:
#   # ... HIER STAAN JE TADO EN DUCOBOX SENSOREN AL ...

  - platform: template
    name: "RH waarde, bron voor de regeling"
    id: rh_actual_active
    unit_of_measurement: "%"
    state_class: "measurement"
    device_class: humidity
    accuracy_decimals: 1
    icon: "mdi:water-percent"
    update_interval: 10s
    disabled_by_default: true
    filters:
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 1
    lambda: |-
      // Grijp de actuele status van beide kamersensoren
      float rh1 = id(tado_woonkamer_rh).state;
      float rh2 = id(rh_smart_x_ha).state; 
      float rh3 = id(ducobox_rh_actual).state; 
      // Nu Home Assistant 'unavailable' doorgeeft, worden deze sensoren dankzij het filter echt NaN
      bool rh1_ok = !std::isnan(rh1);
      bool rh2_ok = !std::isnan(rh2);
      bool rh3_ok = !std::isnan(rh3);
      // static variabelen onthouden hun waarde tussen de lambda-aanroepen door.
      // We beginnen op 0 (geen eerdere situatie bekend).
      static int vorige_situatie = 0; 
      int huidige_situatie = 0;
      // Bepaal de huidige situatie op basis van sensor beschikbaarheid
      if (rh1_ok && rh2_ok) {
        huidige_situatie = 1;
      } else if (!rh1_ok && rh2_ok) {
        huidige_situatie = 2;
      } else if (rh1_ok && !rh2_ok) {
        huidige_situatie = 3;
      } else if (!rh1_ok && !rh2_ok && rh3_ok) {
        huidige_situatie = 4;
      } else {
        huidige_situatie = 5; // Volledige blackout (alle 3 offline)
      }
      // LOGGEN: Alleen als de huidige situatie verschilt van de vorige situatie
      if (huidige_situatie != vorige_situatie) {
        vorige_situatie = huidige_situatie; // Sla de nieuwe situatie op
        switch (huidige_situatie) {
          case 1:
            ESP_LOGI("fallback", "SITUATIE 1: Beide Tado X RH sensoren zijn online en worden gemiddeld.");
            break;
          case 2:
            ESP_LOGW("fallback", "SITUATIE 2: Woonkamer RH sensor van Homeassistant uitgevallen! Schakelt over op sensor 2.");
            break;
          case 3:
            ESP_LOGW("fallback", "SITUATIE 3: Woonkamer RH sensor van Matterjs-server uitgevallen! Schakelt over op sensor 1.");
            break;
          case 4:
            ESP_LOGW("fallback", "SITUATIE 4: Beide sensoren uitgevallen! Schakelt over op sensor 3 (Ducobox RH).");
            break;
          case 5:
            ESP_LOGE("fallback", "SITUATIE 5 - ALARM: Alle temperatuursensoren zijn offline!");
            break;
        }
      }
      // RETURNDATA: Voer de daadwerkelijke berekeningen en returns uit
      if (huidige_situatie == 1) {
        return (rh1 + rh2) / 2.0;
      }
      if (huidige_situatie == 2) {
        return rh2;
      }
      if (huidige_situatie == 3) {
        return rh1;
      }
      if (huidige_situatie == 4) {
        return rh3;
      }
      return 60.0; // Noodwaarde bij situatie 5

  
    # HIER DE TRIGGER TOEVOEGEN:
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return (!isnan(x) && x > 0 && !id(wtw_rh_regeling).is_running() && id(switch_rh_regeling).state);
            then:
              - delay: 0s  # Dit haalt de druk van de sensor-loop af!
              - script.execute: wtw_rh_regeling
          
