  - platform: template
    name: "WTW Handmatige Modus (30min)"
    id: wtw_handmatig_actief 
    icon: mdi:timer-edit-outline

  - platform: template
    name: "WTW Automatische Modus"
    id: wtw_automatische_regeling_actief
    icon: mdi:auto-mode
    lambda: |-
      return (!id(wtw_douche_actief).state && 
              !id(wtw_handmatig_actief).state && 
              id(wtw_systeem_volledig_online) && 
              id(switch_rh_regeling).state);

# matterjs.server node data ophalen 
interval:
  - interval: 61s # modbus_duco_traag staat op 59 sec, beide priemgetallen
    then:
      - lambda: |-
          if (id(global_ws_client) != nullptr) {
            auto* ws = (MyWebsocketComponent*) id(global_ws_client);
            // Gebruik exact jouw geformatteerde JSON string zonder ontsnap-fouten
            ws->send_message(R"({
              "message_id": "1",
              "command": "get_node",
              "args": {
                "node_id": 1
              }
            })");
          }


