# Signaleer douche gebruik max 30min zie script
binary_sensor:
  - platform: template
    name: "WTW Douche Modus"
    id: wtw_douche_actief
    icon: "mdi:shower-head"
    lambda: |-
      // 1. Controleer eerst of beide sensoren een geldige meting hebben
      if (!id(ducobox_rh_actual).has_state() || !id(ducobox_rh_filtered).has_state()) {
        return false;
      }

      // 2. Haal de actuele waarden op
      float val_actual = id(ducobox_rh_actual).state;
      float val_filtered = id(ducobox_rh_filtered).state;
      float verschil = val_actual - val_filtered;

      // 3. Vraag de huidige status van deze binary sensor op (AAN of UIT)
      bool momenteel_actief = id(wtw_douche_actief).state;

      // 4. Evalueer de hysterese-voorwaarden
      if (momenteel_actief) {
        // De douchemodus IS al actief: houd hem actief totdat het verschil zakt naar 2.0 of lager
        if (verschil <= 2.0) {
          return false; // Schakel UIT
        } else {
          return true;  // Blijf AAN
        }
      } else {
        // De douchemodus is momenteel UIT: schakel pas in als het verschil 3.0 of hoger is
        if (verschil >= 3.0) {
          return true;  // Schakel AAN
        } else {
          return false; // Blijf UIT
        }
      }


  - platform: template
    name: "WTW Handmatige Modus (30min)"
    id: wtw_handmatig_actief 
    icon: mdi:timer-edit-outline



  - platform: template
    name: "WTW Automatische Modus"
    id: wtw_automatische_regeling_actief
    icon: mdi:auto-mode
    lambda: |-
      return (!id(wtw_douche_actief).state && 
              !id(wtw_handmatig_actief).state && 
              id(wtw_systeem_volledig_online) && 
              id(switch_rh_regeling).state);


    
sensor:
    
# Node 2: Zoneklep wonen
  - platform: modbus_controller
    modbus_controller_id: duco_box
    name: "Duco zoneklep wonen"
    register_type: read
    address: 22
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: "measurement"
    icon: "mdi:valve"
    disabled_by_default: true

# Node 3: Zoneklep slapen    
  - platform: modbus_controller
    modbus_controller_id: duco_box
    name: "Duco zoneklep slapen"
    register_type: read
    address: 32
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: "measurement"
    icon: "mdi:valve"
    disabled_by_default: true


############################################
    

        
# Node 58: RH box
  - platform: modbus_controller
    modbus_controller_id: duco_box
    name: "Ducobox RH gemeten"
    id: ducobox_rh_actual
    icon: "mdi:water-percent"
    register_type: read         # Gewijzigd naar 'read'
    address: 585                # Gecorrigeerd zonder voorloopnul
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: "measurement"
    device_class: humidity
    accuracy_decimals: 1
    internal: true
    filters:
      - lambda: return x / 100.0 * 1.00;  # factor 10.5 is het verschil tussen RH thermostaat en RH box, thermosstaat leiden
    on_value:
      then:
        - component.update: ducobox_rh_filtered



# Node 58: RH box filtered om pieken van douche en quooker weg te halen
  - platform: template
    name: "Ducobox RH gemeten en gefiltert"
    id: ducobox_rh_filtered
    unit_of_measurement: "%"
    state_class: "measurement"
    device_class: humidity
    accuracy_decimals: 1
    icon: "mdi:water-percent"
    update_interval: never
    disabled_by_default: true
    lambda: |-
      // 1. Controleer of de hoofd-sensor wel online is
      if (!id(ducobox_rh_actual).has_state()) {
        return NAN;
      }

      // 2. Haal de nieuwe waarde op
      float x = id(ducobox_rh_actual).state;
      
      // 3. Onthoud de vorige geldige waarde
      static float vorige_rh = NAN;
      
      // Eerste keer opstarten? Accepteer de waarde.
      if (std::isnan(vorige_rh)) {
        vorige_rh = x;
        return x;
      }
      
      float verschil = std::abs(x - vorige_rh);
      float max_verandering = 1.2; 
      
      // 4. Filter de snelle pieken eruit
      if (verschil > max_verandering) {
        return vorige_rh; // Negeer de piek en geef de oude waarde terug
      } else {
        vorige_rh = x;    // Accepteer de trage verandering
        return x;
      }
    on_value:
      then:
        - component.update: rh_actual_active

  - platform: homeassistant
    name: "Luchtvochtigheid Smart X (HA)"
    entity_id: sensor.smart_thermostat_x_luchtvochtigheid
    id: rh_smart_x_ha
    internal: true # Hiermee voorkom je dat de sensor dubbel in Home Assistant verschijnt
    unit_of_measurement: "%"
    state_class: "measurement"  
    device_class: humidity
    icon: "mdi:water-percent"
    accuracy_decimals: 1
    filters:
    - clamp:
        min_value: 10
        max_value: 99
        ignore_out_of_range: true
    on_value:
      then:
        - component.update: rh_actual_active



  - platform: template
    name: "RH waarde, bron voor de regeling"
    id: rh_actual_active
    unit_of_measurement: "%"
    state_class: "measurement"
    device_class: humidity
    accuracy_decimals: 1
    icon: "mdi:water-percent"
    update_interval: 60s
    disabled_by_default: true
    lambda: |-
      // 1. Controleer of 'rh_smart_x_ha' bestaat en een geldige waarde heeft
      // Als HA 'unavailable' of 'unknown' stuurt, is .has_state() automatisch false.
      if (id(rh_smart_x_ha).has_state() && !std::isnan(id(rh_smart_x_ha).state)) {
        float ha_val = id(rh_smart_x_ha).state;
        
        // 2. Controleer of de waarde netjes tussen 1 en 100 ligt
        if (ha_val >= 1.0 && ha_val <= 100.0) {
          return ha_val; // Gebruik Home Assistant waarde
        } else {
          ESP_LOGW("duco_selectie", "Home Assistant RH waarde buiten bereik (1-100): %.1f%%.", ha_val);
        }
      } else {
        ESP_LOGW("duco_selectie", "Home Assistant RH sensor is offline of onbeschikbaar.");
      }
      
      // 3. Fallback: Gebruik de gefilterde Modbus waarde
      if (id(ducobox_rh_filtered).has_state()) {
        return id(ducobox_rh_filtered).state;
      }
      
      // 4. Als echt alles offline is
      ESP_LOGE("duco_selectie", "Zowel Home Assistant als Modbus sensor zijn onbeschikbaar!");
      return NAN;

    # HIER DE TRIGGER TOEVOEGEN:
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return (!isnan(x) && x > 0 && !id(wtw_rh_regeling).is_running() && id(switch_rh_regeling).state);
            then:
              - script.execute: wtw_rh_regeling



  # Dynamische weergave van het berekende setpoint doel
  - platform: template
    name: "RH Berekend Doel"
    id: rh_berekend_doel
    unit_of_measurement: "%"
    icon: "mdi:water-percent"
    accuracy_decimals: 0
    state_class: "measurement"
    disabled_by_default: true
    lambda: |-
      // Geeft dynamisch de waarde terug die je via scripts of on_boot pusht
      if (id(rh_berekend_doel).has_state()) {
        return id(rh_berekend_doel).state;
      }
      return 55.0; // Fallback startwaarde




  # ==============================================================================
  # WEERGAVE SENSOR: RESTERENDE TIJD HANDMATIGE MODUS (In minuten via global)
  # ==============================================================================
  - platform: template
    name: "Handmatig modus (resterende tijd)"
    id: handmatig_resterende_tijd
    unit_of_measurement: "min"
    icon: "mdi:timer-sand"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      // Controleer of de handmatige vlag actief is én of er een geldige starttijd is
      if (id(wtw_handmatig_actief).state && id(last_manual_setpoint_change) > 0) {
        uint32_t verstreken = millis() - id(last_manual_setpoint_change);
        uint32_t totaal_handmatig_ms = 1800000; // 30 minuten in ms
        
        if (verstreken >= totaal_handmatig_ms) {
          return 0.0;
        }
        
        uint32_t resterend_ms = totaal_handmatig_ms - verstreken;
        return (float)resterend_ms / 1000.0 / 60.0;
      }
      return 0.0;
    web_server:
      sorting_group_id: sorting_group_timers
      sorting_weight: 20

  # ==============================================================================
  # WEERGAVE SENSOR: RESTERENDE TIJD COOLDOWN REGELING (Gecorrigeerd)
  # ==============================================================================
  - platform: template
    name: "Cooldown modus (resterende tijd)"
    id: cooldown_resterende_tijd
    unit_of_measurement: "min"
    icon: "mdi:timer-sand"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (id(wtw_cooldown_actief) && id(start_cooldown_tijd) > 0) {
        uint32_t verstreken = millis() - id(start_cooldown_tijd);
        uint32_t totaal_cooldown_ms = 900000; // 15 minuten in ms
        
        if (verstreken >= totaal_cooldown_ms) {
          return 0.0;
        }
        
        uint32_t resterend_ms = totaal_cooldown_ms - verstreken;
        return (float)resterend_ms / 1000.0 / 60.0;
      }
      return 0.0;
    web_server:
      sorting_group_id: sorting_group_timers
      sorting_weight: 21

  # ==============================================================================
  # WEERGAVE SENSOR: RESTERENDE TIJD VERIFICATIE WACHTBUNDEL (In minuten)
  # ==============================================================================
  - platform: template
    name: "Verificatie regeling (resterende tijd)"
    id: verificatie_resterende_tijd
    unit_of_measurement: "min"
    icon: "mdi:timer-sand"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (id(start_verificatie_tijd) > 0) {
        uint32_t verstreken = millis() - id(start_verificatie_tijd);
        uint32_t totaal_verificatie_ms = 300000; // 5 minuten in ms
        
        if (verstreken >= totaal_verificatie_ms) {
          return 0.0;
        }
        
        uint32_t resterend_ms = totaal_verificatie_ms - verstreken;
        return (float)resterend_ms / 1000.0 / 60.0;
      }
      return 0.0;
    web_server:
      sorting_group_id: sorting_group_timers
      sorting_weight: 22


      
# ==============================================================================
# 5. CORE SCRIPTS (Regeling, Timers en Modus-coördinatie)
# ==============================================================================
script:
  # ==========================================
  # HOOFDREGELING: COORDINATOR SCRIPT (Routeert de modi)
  # ==========================================
  - id: wtw_rh_regeling
    mode: restart
    then:
      # 1. Opstart checks
      - lambda: |-
          if (!id(wtw_systeem_volledig_online)) return;

      # 2. Modus selectie op basis van de sensors en vlaggen
      - if:
          condition:
            # Als de schakelaar uit staat, stoppen we alle regelingen
            lambda: return (id(switch_rh_regeling).state == false);
          then:
            - script.stop: wtw_modus_douche
            - script.stop: wtw_modus_handmatig
            - script.stop: wtw_modus_normaal
            - lambda: |-
                id(start_verificatie_tijd) = 0;
                id(wtw_handmatig_actief).publish_state(false);
            - script.stop: wtw_rh_regeling

      - if:
          condition:
            # Modus 1: Douche heeft de allerhoogste prioriteit (gebruikt de binary_sensor status)
            lambda: return id(wtw_douche_actief).state;
          then:
            - script.execute: wtw_modus_douche
            - script.stop: wtw_modus_handmatig
            - script.stop: wtw_modus_normaal

          else:
            - if:
                condition:
                  # Modus 2: Handmatige bediening heeft prioriteit over normaal automatisch
                  lambda: return id(wtw_handmatig_actief).state;
                then:
                  # --- FIX: Start het handmatige script ENKEL als het niet al draait ---
                  - if:
                      condition:
                        lambda: return !id(wtw_modus_handmatig).is_running();
                      then:
                        - script.execute: wtw_modus_handmatig
                  - script.stop: wtw_modus_douche
                  - script.stop: wtw_modus_normaal
                else:
                  # Modus 3: Normaal automatisch bedrijf
                  - script.execute: wtw_modus_normaal
                  - script.stop: wtw_modus_douche
                  - script.stop: wtw_modus_handmatig

  
  # ==========================================
  # MODUS 1: DOUCHE BEDRIJF (GEOPTIMALISEERD)
  # ==========================================
  - id: wtw_modus_douche
    mode: single
    then:
      - lambda: |-
          int doel = 55;
          id(rh_berekend_doel).publish_state(doel);

          // Correcte static bool die ENKEL logt als de status écht verandert
          static bool status_was_actief = false;
          if (!status_was_actief) {
            ESP_LOGW("wtw_regeling", "Douche modus wordt gestart. RH setpoint wordt op 55%% gezet.");
            status_was_actief = true;
          }
          
          // HARD RESET: Deactiveer en wis de cooldown direct bij douche-activiteit
          id(wtw_cooldown_actief) = false;
          id(start_cooldown_tijd) = 0;
          
          // CRUCIALE RESET: Zet de 5-minuten verificatietimer direct op 0
          id(start_verificatie_tijd) = 0;

          // Stop de andere modi om timers en delays te resetten
          id(wtw_modus_normaal).stop();
          id(wtw_modus_handmatig).stop();
          id(wtw_handmatig_actief).publish_state(false);

      # Fysieke Modbus verzending
      - if:
          condition:
            lambda: return ((int)id(rh_setpoint).state != 55);
          then:
            - number.set:
                id: rh_setpoint
                value: 55
            - lambda: ESP_LOGW("wtw_regeling", "Douche modus actief. RH setpoint op 55%% gezet.");



              
  # ==========================================
  # MODUS 2: HANDMATIGE OVERRULE MODUS
  # ==========================================
  # ==========================================
  # MODUS 2: HANDMATIGE OVERRULE MODUS (Gecorrigeerd)
  # ==========================================
  - id: wtw_modus_handmatig
    mode: single # Voorkomt herstarts en timer-resets
    then:
      - lambda: |-
          int handmatig_doel = (int)id(rh_setpoint).state;
          id(rh_berekend_doel).publish_state(handmatig_doel);
          id(last_manual_setpoint_change) = millis();
          // Logt slechts één keer
          ESP_LOGI("wtw_regeling", "Handmatige modus actief: %d%%.", handmatig_doel);
      - delay: 30min
      - script.execute: wtw_rh_regeling

  # - id: wtw_modus_handmatig
  #   mode: single
  #   then:
  #     - lambda: |-
  #         // We lezen de handmatige invoer en spiegelen deze direct aan het doel.
  #         int handmatig_doel = (int)id(rh_setpoint).state;
  #         id(rh_berekend_doel).publish_state(handmatig_doel);

  #         // Sla de starttijd op in de bestaande global voor onze weergavesensor
  #         id(last_manual_setpoint_change) = millis();
          
  #         // CRUCIALE RESET: Zet de 5-minuten verificatietimer direct op 0
  #         id(start_verificatie_tijd) = 0;

  #         // We resetten de normale modus zodat de 5-minutentimer stopt
  #         id(wtw_modus_normaal).stop();
  #         ESP_LOGI("wtw_regeling", "Handmatige modus actief voor 30 minuten op %d%%.", handmatig_doel);

  #     - delay: 30min
  #     - lambda: |-
  #         ESP_LOGI("wtw_regeling", "Handmatige modus tijd verstreken. Terug naar automatisch...");
  #         id(wtw_handmatig_actief).publish_state(false);
  #         id(last_manual_setpoint_change) = 0; // Reset de timer global
  #     - script.execute: wtw_rh_regeling

  # ==========================================
  # MODUS 3: NORMAAL AUTOMATISCH BEDRIJF
  # ==========================================
  - id: wtw_modus_normaal
    mode: single # Let op: staat op single, dat is goed!
    then:
      # Stap 1: Voorwaarden & Beveiligingen
      - if:
          condition:
            lambda: |-
              if (!id(wtw_systeem_volledig_online)) return true;
              return (isnan(id(rh_setpoint).state) || isnan(id(rh_actual_active).state) || id(rh_setpoint).state <= 0);
          then:
            - lambda: |-
                id(start_verificatie_tijd) = 0; // Reset als de modus niet mag draaien
            - script.stop: wtw_modus_normaal

      # Stap 2: Berekening (Exacte Hysteresis: Stijgen 0, Dalen -2)
      - lambda: |-
          if (!id(rh_actual_active).has_state()) return;
          float actueel = (float)id(rh_actual_active).state;
          int current_setpoint = (int)id(rh_setpoint).state;
          int doel = 55;

          // 1. Exacte Hysteresis bepaling op basis van stijgen/dalen
          static float vorige_actuele_rh = -1.0;
          float hys = 0.0;
          
          if (vorige_actuele_rh >= 0.0) {
            if (actueel > vorige_actuele_rh) {
              hys = 0.0;   // Bij stijgen: direct schakelen op de harde grens
            } else if (actueel < vorige_actuele_rh) {
              hys = -2.0;  // Bij dalen: verlaag de drempels met 2% (houdt de hogere stand langer vast)
            }
          }
          vorige_actuele_rh = actueel;

          // 2. Trap-bepaling met jouw hysteresis-factor
          if (actueel > (90.0 + hys))       doel = 90;
          else if (actueel > (80.0 + hys))  doel = 80;
          else if (actueel > (65.0 + hys))  doel = 70;
          else if (actueel > (60.0 + hys))  doel = 65;
          else if (actueel > (55.0 + hys))  doel = 60;
          else                              doel = 55;

          // 3. CRUCIALE FIX: Als de luchtvochtigheid onder de absolute basisgrens (55%) zakt,
          // mag de dalende hysteresis de waarde nooit meer in de 60% trap houden.
          if (actueel <= 55.0) {
            doel = 55;
          }

          id(rh_berekend_doel).publish_state(doel);

          // Cooldown verwerking (15 min)
          if (id(wtw_cooldown_actief)) {
            if (id(start_cooldown_tijd) == 0) id(start_cooldown_tijd) = millis();
            if (millis() - id(start_cooldown_tijd) >= 900000) {
              id(wtw_cooldown_actief) = false;
              id(start_cooldown_tijd) = 0;
              ESP_LOGI("wtw_regeling", "Cooldown verstreken.");
            }
          }

          if (id(wtw_cooldown_actief) && (doel > current_setpoint)) {
            ESP_LOGD("wtw_regeling", "Wijziging geblokkeerd door actieve Cooldown.");
            return; 
          }

      # --- STAP 3 & 4: TIMERVERIFICATIE EN VERZENDING VIA NATIVE YAML ---
      - if:
          condition:
            lambda: |-
              int current_setpoint = (int)id(rh_setpoint).state;
              int doel = (int)id(rh_berekend_doel).state;
              return (doel != current_setpoint);
          then:
            - if:
                condition:
                  lambda: |-
                    // FIX: Als de douche net uit is, neem direct het berekende doel over (ongeacht of dit 55% of 60% is)
                    return (id(wtw_douche_actief).state == false);
                then:
                  - lambda: |-
                      int doel = (int)id(rh_berekend_doel).state;
                      id(start_verificatie_tijd) = 0;
                      ESP_LOGI("wtw_regeling", "RH setpoint naar (%d%%) zonder 5 minutes verificatie.", doel);
                      //ESP_LOGW("wtw_regeling", "Douche modus afgelopen: RH setpoint naar (%d%%) zonder 5 minutes verificatie.", doel);
                  - number.set:
                      id: rh_setpoint
                      value: !lambda |-
                        return id(rh_berekend_doel).state;
                else:
                  # --- Normale verloop met 5 minuten verificatie ---
                  - lambda: |-
                      if (id(start_verificatie_tijd) == 0) {
                        id(start_verificatie_tijd) = millis();
                        ESP_LOGI("wtw_regeling", "Woonkamer RH eist nieuw setpoint (%d%%, huidige stand: %d%%). Start 5 minuten verificatie...", (int)id(rh_berekend_doel).state, (int)id(rh_setpoint).state);
                      }
                  
                  - delay: 300s
                  
                  # Na 5 minuten controleren we de status opnieuw VOORDAT we de timer wissen
                  - if:
                      condition:
                        lambda: |-
                          int current_setpoint = (int)id(rh_setpoint).state;
                          int doel = (int)id(rh_berekend_doel).state;
                          return (doel != current_setpoint);
                      then:
                        - lambda: |-
                            id(start_verificatie_tijd) = 0;
                            ESP_LOGW("wtw_regeling", "Verificatie succesvol na 5 minuten. Schrijf nu %d%% naar Modbus.", (int)id(rh_berekend_doel).state);
                        - number.set:
                            id: rh_setpoint
                            value: !lambda |-
                              return id(rh_berekend_doel).state;
                      else:
                        - lambda: |-
                            id(start_verificatie_tijd) = 0;
          else:
            - lambda: |-
                id(start_verificatie_tijd) = 0;




