# ==============================================================================
# 5. CORE SCRIPTS (Regeling, Timers en Modus-coördinatie)
# ==============================================================================

script:
  - id: verwerk_rh_wijziging
    mode: restart # Als er snel achter elkaar getriggerd wordt, herstart het script netjes
    parameters:
      x_waarde: float
    then:
      - lambda: |-
          int binnenkomende_waarde = (int)x_waarde;
          int berekend_doel = (int)id(rh_berekend_doel).state;
          int vorige_waarde = id(vorige_rh_setpoint);

          // CRUCIALE BOOT-FIX
          if (vorige_waarde == 0) {
            id(vorige_rh_setpoint) = binnenkomende_waarde;
            ESP_LOGI("main", "Eerste Modbus-poll na boot: %d%%.", binnenkomende_waarde);
            return;
          }

          id(vorige_rh_setpoint) = binnenkomende_waarde;

          if (binnenkomende_waarde == vorige_waarde) return;

          if (binnenkomende_waarde == berekend_doel) {
            ESP_LOGI("main", "Automatische RH setpoint update naar %d%%.", binnenkomende_waarde);
            return;
          }

          if (id(wtw_douche_actief).state) {
            ESP_LOGD("main", "Modbus wijziging genegeerd: Douche-afwikkeling actief.");
            return;
          }

          if (id(wtw_handmatig_actief).state) return;

          // Gebruiker actie
          id(wtw_rh_regeling).stop();
          id(wtw_modus_normaal).stop();
          id(wtw_handmatig_actief).publish_state(true);
          ESP_LOGI("main", "Handmatige modus door gebruiker! Van %d%% naar %d%%.", vorige_waarde, binnenkomende_waarde);


  # ==========================================
  # HOOFDREGELING: COORDINATOR SCRIPT (Routeert de modi)
  # ==========================================
  - id: wtw_rh_regeling
    mode: restart
    then:
      # 1. Opstart checks
      - lambda: |-
          if (!id(wtw_systeem_volledig_online)) return;

      # # 2. Modus selectie op basis van de sensors en vlaggen
      # - if:
      #     condition:
      #       # Als de schakelaar uit staat, stoppen we alle regelingen
      #       lambda: return (id(switch_rh_regeling).state == false);
      #     then:
      #       - script.stop: wtw_modus_douche
      #       - script.stop: wtw_modus_handmatig
      #       - script.stop: wtw_modus_normaal
      #       - lambda: |-
      #           id(start_verificatie_tijd) = 0;
      #           id(wtw_handmatig_actief).publish_state(false);
      #           id(global_douche_vorige_status) = false;
      #       - script.stop: wtw_rh_regeling

      # - if:
      #     condition:
      #       # Modus 1: Douche heeft de allerhoogste prioriteit (gebruikt de binary_sensor status)
      #       lambda: return id(wtw_douche_actief).state;
      #     then:
      #       - lambda: |-
      #           if (!id(global_douche_vorige_status)) {
      #             ESP_LOGW("wtw_regeling", "Douche modus wordt gestart. RH setpoint wordt op 55%% gezet.");
      #             id(global_douche_vorige_status) = true;
      #           }
      #       - script.execute: wtw_modus_douche
      #       - script.stop: wtw_modus_handmatig
      #       - script.stop: wtw_modus_normaal
      # 2. Modus selectie op basis van de sensors en vlaggen
      - if:
          condition:
            # Als de schakelaar uit staat, stoppen we alle regelingen
            lambda: return (id(switch_rh_regeling).state == false);
          then:
            - script.stop: wtw_modus_douche
            - script.stop: wtw_modus_handmatig
            - script.stop: wtw_modus_normaal
            - lambda: |-
                id(start_verificatie_tijd) = 0;
                id(wtw_handmatig_actief).publish_state(false);
                id(global_douche_vorige_status) = false;
            - script.stop: wtw_rh_regeling

      - if:
          condition:
            # Modus 1: Douche heeft de allerhoogste prioriteit (gebruikt de binary_sensor status)
            lambda: return id(wtw_douche_actief).state;
          then:
            - lambda: |-
                if (!id(global_douche_vorige_status)) {
                  ESP_LOGW("wtw_regeling", "Douche modus wordt gestart. RH setpoint wordt op 55%% gezet.");
                  id(global_douche_vorige_status) = true;
                }
            - script.execute: wtw_modus_douche  # Hersteld naar execute
            - script.stop: wtw_modus_handmatig
            - script.stop: wtw_modus_normaal
          

          else:
            - if:
                condition:
                  # Modus 2: Handmatige bediening heeft prioriteit over normaal automatisch
                  lambda: return id(wtw_handmatig_actief).state;
                then:
                  - lambda: |-
                      if (id(global_douche_vorige_status)) {
                        ESP_LOGW("wtw_regeling", "Douche modus beëindigd. Regeling wordt overgedragen aan Automatische modus.");
                        id(global_douche_vorige_status) = false;
                      }
                  # --- FIX: Start het handmatige script ENKEL als het niet al draait ---
                  - if:
                      condition:
                        lambda: return !id(wtw_modus_handmatig).is_running();
                      then:
                        - script.execute: wtw_modus_handmatig
                        - script.stop: wtw_modus_douche
                        - script.stop: wtw_modus_normaal
                else:
                  # Modus 3: Normaal automatisch bedrijf
                  - lambda: |-
                      if (id(global_douche_vorige_status)) {
                        ESP_LOGW("wtw_regeling", "Douche modus beëindigd. Directe overgang naar het nieuwe berekende doel.");
                        // We resetten de verificatietijd naar 1 om direct doorschrijven toe te staan bij de eerste loop
                        id(start_verificatie_tijd) = 1; 
                        id(global_douche_vorige_status) = false;
                      }
                  # --- FIX: Start de normale modus ENKEL als deze nog niet draait! ---
                  # Dit voorkomt dat de 5-minuten delay telkens opnieuw gereset wordt.
                  - if:
                      condition:
                        lambda: return !id(wtw_modus_normaal).is_running();
                      then:
                        - script.execute: wtw_modus_normaal
                        - script.stop: wtw_modus_douche
                        - script.stop: wtw_modus_handmatig


  # ==========================================
  # MODUS 1: DOUCHE BEDRIJF (GEOPTIMALISEERD)
  # ==========================================
  - id: wtw_modus_douche
    mode: single
    then:
      - lambda: |-
          int doel = 55;
          id(rh_berekend_doel).publish_state(doel);
          
          // HARD RESET: Deactiveer en wis de cooldown direct bij douche-activiteit
          id(wtw_cooldown_actief) = false;
          id(start_cooldown_tijd) = 0;
          
          // CRUCIALE RESET: Zet de 5-minuten verificatietimer direct op 0
          id(start_verificatie_tijd) = 0;

          // Stop de andere modi om timers en delays te resetten
          id(wtw_modus_normaal).stop();
          id(wtw_modus_handmatig).stop();
          id(wtw_handmatig_actief).publish_state(false);

      # Fysieke Modbus verzending
      - if:
          condition:
            lambda: return ((int)id(rh_setpoint).state != 55);
          then:
            - number.set:
                id: rh_setpoint
                value: 55
            - lambda: ESP_LOGI("wtw_regeling", "Modbus opdracht verzonden RH setpoint op 55%% gezet.");

              
  # ==========================================
  # MODUS 2: HANDMATIGE OVERRULE MODUS
  # ==========================================
  - id: wtw_modus_handmatig
    mode: single # Voorkomt herstarts en timer-resets
    then:
      - lambda: |-
          int handmatig_doel = (int)id(rh_setpoint).state;
          id(rh_berekend_doel).publish_state(handmatig_doel);
          id(last_manual_setpoint_change) = millis();
          // Logt slechts één keer
          ESP_LOGI("wtw_regeling", "Handmatige modus actief: %d%%.", handmatig_doel);
      - delay: 30min
      - script.execute: wtw_rh_regeling

  # ==========================================
  # MODUS 3: NORMAAL AUTOMATISCH BEDRIJF
  # ==========================================
  - id: wtw_modus_normaal
    mode: single
    then:
      # Stap 1: Voorwaarden & Beveiligingen
      - if:
          condition:
            lambda: |-
              if (!id(wtw_systeem_volledig_online)) return true;
              return (isnan(id(rh_setpoint).state) || isnan(id(rh_actual_active).state) || id(rh_setpoint).state <= 0);
          then:
            - lambda: |-
                id(start_verificatie_tijd) = 0; // Reset als de modus niet mag draaien
            - script.stop: wtw_modus_normaal

      # Stap 2: Berekening (Hysteresis gekoppeld aan de actuele Modbus-status)
      - lambda: |-
          if (!id(rh_actual_active).has_state()) return;
          float actueel = (float)id(rh_actual_active).state;
          int current_setpoint = (int)id(rh_setpoint).state;
          int doel = 55;

          // 1. Dynamische hysteresis op basis van het HUIDIGE Modbus-setpoint
          // Als we op een bepaalde trap staan, verlagen we de drempel om te zakken met 2%
          float hys_90 = (current_setpoint == 90) ? -2.0 : 0.0;
          float hys_80 = (current_setpoint == 80) ? -2.0 : 0.0;
          float hys_70 = (current_setpoint == 70) ? -2.0 : 0.0;
          float hys_65 = (current_setpoint == 65) ? -2.0 : 0.0;
          float hys_60 = (current_setpoint == 60) ? -2.0 : 0.0;

          // 2. Trap-bepaling met vaste stabiele hysteresis drempels
          if (actueel > (90.0 + hys_90))       doel = 90;
          else if (actueel > (80.0 + hys_80))  doel = 80;
          else if (actueel > (65.0 + hys_70))  doel = 70;
          else if (actueel > (60.0 + hys_65))  doel = 65;
          else if (actueel > (55.0 + hys_60))  doel = 60;
          else                                 doel = 55;

          // 3. Absolute basisgrens beveiliging
          if (actueel <= 55.0) {
            doel = 55;
          }

          id(rh_berekend_doel).publish_state(doel);

          // Cooldown verwerking (15 min)
          if (id(wtw_cooldown_actief)) {
            if (id(start_cooldown_tijd) == 0) id(start_cooldown_tijd) = millis();
            if (millis() - id(start_cooldown_tijd) >= 900000) {
              id(wtw_cooldown_actief) = false;
              id(start_cooldown_tijd) = 0;
              ESP_LOGI("wtw_regeling", "Cooldown beëindigd.");
            }
          }

          // ====================================================================
          // DE BOOT FIX (Met dynamische secondenweergave)
          // ====================================================================
          if (id(wtw_eerste_berekening_na_boot)) {
            float opstart_seconden = millis() / 1000.0;
            ESP_LOGI("wtw_regeling", "Systeem is online (%.1fs na boot). Eerste berekening activeert direct doel: %d%%", opstart_seconden, doel);
            id(rh_setpoint).make_call().set_value(doel).perform();
            id(start_verificatie_tijd) = 0;
            id(wtw_eerste_berekening_na_boot) = false;
            return;
          }

          // ====================================================================
          // NORMALE REGELING WITH TIMER (Blijft ongewijzigd)
          // ====================================================================
          if (doel != current_setpoint) {
            if (id(start_verificatie_tijd) == 0) {
              id(start_verificatie_tijd) = millis();
              ESP_LOGI("wtw_regeling", "Nieuw doel berekend (%d%%). Start 5 minuten verificatietijd.", doel);
            }
            
            if (millis() - id(start_verificatie_tijd) >= 300000) {
              ESP_LOGI("wtw_regeling", "Verificatietijd verstreken. Schrijf nieuw setpoint naar Modbus: %d%%", doel);
              id(rh_setpoint).make_call().set_value(doel).perform();
              id(start_verificatie_tijd) = 0;
            }
          } else {
            id(start_verificatie_tijd) = 0;
          }

