sensor:

  - platform: uptime
    name: "ESP Uptime"
    id: esp_uptime
    update_interval: 60s



  
  # ==============================================================================
  # Matterjs_server sensoren, temperaturen en vochtigheid
  # ==============================================================================
  
# SENSOR 1: Tado X Woonkamer Temperatuur
  - platform: template
    name: "Temp Tado X Woonkamer"
    id: tado_woonkamer_temp
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    icon: "mdi:thermometer"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      if (id(global_ws_client) == nullptr) { return NAN; }
      auto* ws = (MyWebsocketComponent*) id(global_ws_client);
      
      // Vraagt de eigen temperatuur-postbus op uit de C++ code
      std::string x = ws->get_temp_payload();

      // 1. Als de payload helemaal leeg is, behoud dan de huidige status (voorkomt flapperen)
      if (x.empty()) {
        return id(tado_woonkamer_temp).state;
      }

      // FILTER CODE VOLLEDIG IN DE SENSOR: Zoek naar het temperatuurpad
      size_t path_pos = x.find("1/513/0");
      if (path_pos != std::string::npos) {
        size_t pos = x.find_first_of("0123456789", path_pos + 7);
        if (pos != std::string::npos) {
          std::string digits = "";
          for (size_t i = pos; i < x.length(); i++) {
            if (isdigit(x[i])) digits += x[i];
            else if (!digits.empty() && !isdigit(x[i])) break;
          }
          if (!digits.empty()) {
            float raw_temp = std::stof(digits);
            // Matter-validatie: Temperatuur ligt binnen het ingestelde bereik
            if (raw_temp > 500 && raw_temp < 4000) { 
              return raw_temp / 100.0; // Converteert bijv. 2150 naar 21.50 °C
            }
          }
        }
      }
      
      // 2. Als de payload wél gevuld was, maar de data was corrupt of de sensor ontbrak: geef NAN
      return NAN;



# SENSOR 2: Tado X Woonkamer Luchtvochtigheid (Nieuw!)
  - platform: template
    name: "RH Tado X Woonkamer"
    id: tado_woonkamer_rh
    unit_of_measurement: "%"
    device_class: "humidity"
    state_class: "measurement"
    icon: "mdi:water-percent"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      if (id(global_ws_client) == nullptr) { return NAN; }
      auto* ws = (MyWebsocketComponent*) id(global_ws_client);
      
      // Vraagt de eigen luchtvochtigheid-postbus op uit de C++ code
      std::string x = ws->get_rh_payload();
      
      // 1. Als de payload helemaal leeg is, behoud dan de huidige status (voorkomt flapperen)
      if (x.empty()) {
        return id(tado_woonkamer_rh).state;
      }
      
      // FILTER CODE VOLLEDIG IN DE SENSOR: Zoek naar het vochtigheidspad
      size_t path_pos = x.find("2/1029/0");
      if (path_pos != std::string::npos) {
        size_t pos = x.find_first_of("0123456789", path_pos + 8);
        if (pos != std::string::npos) {
          std::string digits = "";
          for (size_t i = pos; i < x.length(); i++) {
            if (isdigit(x[i])) digits += x[i];
            else if (!digits.empty() && !isdigit(x[i])) break;
          }
          if (!digits.empty()) {
            float raw_rh = std::stof(digits);
            // Matter-validatie: Luchtvochtigheid ligt tussen 0% en 100% (0 tot 10000)
            if (raw_rh >= 0 && raw_rh <= 10000) {
              return raw_rh / 100.0; // Converteert bijv. 6215 naar 62.15 %
            }
          }
        }
      }
      
      // 2. Als de payload wél gevuld was, maar de data was corrupt of de sensor ontbrak: geef NAN
      return NAN; 


