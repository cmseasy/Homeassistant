    modbus_controller_id: modbus_duco_traag
    name: "WTW RH setpoint"
    id: rh_setpoint
    icon: "mdi:water-percent"
    register_type: holding
    address: 582
    value_type: S_WORD
    min_value: 0
    max_value: 100
    step: 5
    mode: box
    unit_of_measurement: "%"
    disabled_by_default: false
    force_new_range: true # was true 

    write_lambda: |-
      ESP_LOGI("main", "Schrijf setpoint %d%% naar Modbus.", (int)x);
      return x;

    on_value:
      then:
        - lambda: |-
            // Snelle pre-checks om de event-loop DIRECT vrij te geven
            if (std::isnan(x) || !id(wtw_systeem_volledig_online)) {
              return; 
            }
            // Start direct het asynchrone script en geef de waarde mee
            id(verwerk_rh_wijziging).execute(x);
    web_server:
      sorting_group_id: sorting_group_configuration_setup
      sorting_weight: 5

# Signaleer douche gebruik max 30min zie script
binary_sensor:
  - platform: template
    name: "WTW Douche Modus"
    id: wtw_douche_actief
    icon: "mdi:shower-head"
    
    # Gebruik filters om de sensor na exact 1 uur geforceerd uit te zetten
    on_press:
      - delay: 1h
      - if:
          condition:
            binary_sensor.is_on: wtw_douche_actief
          then:
            - logger.log:
                level: WARN
                tag: "wtw_douche"
                format: "Douche modus geforceerd beëindigd: maximale tijd van 1 uur bereikt."
            # We forceren de uitschakeling door de globale timer handmatig op een herkenbare 'override' waarde te zetten
            - lambda: |-
                id(start_douche_tijd) = 999; 
                id(wtw_douche_actief).publish_state(false);

    lambda: |-
      // 1. Controleer eerst of beide sensoren een geldige meting hebben
      if (!id(ducobox_rh_actual).has_state() || !id(ducobox_rh_filtered).has_state()) {
        return false;
      }

      // 2. Haal de actuele waarden op
      float val_actual = id(ducobox_rh_actual).state;
      float val_filtered = id(ducobox_rh_filtered).state;
      float verschil = val_actual - val_filtered;

      // 3. Vraag de huidige status op
      bool momenteel_actief = id(wtw_douche_actief).state;

      // Check of de 1-uurs timer de boel zojuist geforceerd heeft uitgezet
      if (id(start_douche_tijd) == 999) {
        // Houd de sensor uit totdat de badkamer weer droog is (verschil onder hysterese)
        if (verschil <= 2.0) {
          id(start_douche_tijd) = 0; // Reset de override status
        }
        return false;
      }

      // 4. Evalueer de hysterese-voorwaarden
      if (momenteel_actief) {
        // De douchemodus IS al actief: houd hem actief totdat het verschil zakt naar 2.0 of lager
        if (verschil <= 2.0) {
          return false; // Schakel UIT
        } else {
          return true;  // Blijf AAN
        }
      } else {
        // De douchemodus is momenteel UIT: schakel pas in als het verschil 3.0 of hoger is
        if (verschil >= 3.0) {
          return true;  // Schakel AAN
        } else {
          return false; // Blijf UIT
        }
      }


