    id: voltage
    register_type: holding
    address: 0x0044
    value_type: S_WORD
    accuracy_decimals: 0
    device_class: voltage
    unit_of_measurement: V
    #skip_updates: 5
    filters:
      - multiply: 0.99
      - clamp:
          min_value: 207
          max_value: 253
          ignore_out_of_range: false  
      # - heartbeat:
      #     period: 60s
      #     optimistic: false
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1

  - platform: modbus_controller
    modbus_controller_id: modbus_adlar
    name: "AC Input Current"
    id: current
    register_type: holding
    address: 0x0045
    value_type: S_WORD
    accuracy_decimals: 3
    device_class: current
    unit_of_measurement: A
    #skip_updates: 5
    filters:
      # - heartbeat:
      #     period: 60s
      #     optimistic: true
      - multiply: 0.1
      - clamp:
          min_value: 0
          max_value: 16
          ignore_out_of_range: false  
      - calibrate_linear:
          method: exact
          datapoints:
           - 0.0 -> 0.0 # Map 0.0 (from sensor) to 0.0 (true value)
           - 1.0 -> 1.0 #?
           - 2.0 -> 1.8 #?
           - 3.0 -> 2.5 #?
           - 4.0 -> 2.9
           - 5.0 -> 3.4
           - 6.0 -> 4.6 #?
           - 7.0 -> 5.5 #5.9?
           - 8.0 -> 6.8 #6.4?
           - 9.0 -> 7.8 
           - 10.0 -> 8.5
           - 11.0 -> 9.0

