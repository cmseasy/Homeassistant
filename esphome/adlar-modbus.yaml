  - platform: template
    name: "AC Input Power"
    id: power_in
    lambda: |-
      return int(id(voltage).state * id(current).state);
    accuracy_decimals: 0
    
    filters:
#      - skip_initial: 1
      # - median:
      #     window_size: 3
      #     send_every: 1
      # - lambda: |-
