  - platform: modbus_controller
    modbus_controller_id: modbus_adlar
    name: "Compressor Running Frequency"
    id: compressor_frequentie
    register_type: holding
    address: 0x0040
    device_class: frequency
    value_type: S_WORD
    accuracy_decimals: 0
    unit_of_measurement: Hz
    filters:
      - lambda: |-
          // 1. Controleer op Modbus-fouten (NAN) of waarden buiten het bereik (0 - 150)
          if (isnan(x) || x < 0 || x > 150) {
            // 2. Als er een oude geldige waarde is, stuur die dan opnieuw op
            if (id(compressor_frequentie).has_state()) {
              return id(compressor_frequentie).state;
            }
            // 3. Als er bij het opstarten nog geen waarde is, negeer de update
            return {}; 
          }
          // 4. Als de waarde geldig is, stuur deze door
          return x;


