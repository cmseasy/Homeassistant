  - platform: template
    name: "Thermal Output Power"
    id: power_out
    filters:
      # - median:
      #     window_size: 3
      #     send_every: 1
      #     send_first_at: 1
      # - skip_initial: 1
      - clamp:
          min_value: -1 # 0
          max_value: 9000
          ignore_out_of_range: true # false
      - lambda: |-
          if (id(power_in).state > 0) {
            return x; // Pass the current value through
          } else {
            return 0;  // Drop the value (no update)
          }
    lambda: |-
      const float smw = 0.998;  // soortelijke massa water
      const float sww = 4186;   // soortelijke warmte water
      return int((id(water_flow).state / 1000 / 60) * smw * sww * abs((id(temp_outlet).state - id(temp_inlet).state) * 1000));
    accuracy_decimals: 0
    unit_of_measurement: "W"
    device_class: power
    state_class: "measurement"
    disabled_by_default: true

