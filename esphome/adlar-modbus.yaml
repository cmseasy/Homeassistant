      #       return {}; // Drop the value (no update)
      #     }
      - clamp:
          min_value: -1 # 0
          max_value: 2000
          ignore_out_of_range: true # false
    unit_of_measurement: "W"
    device_class: power
    
  - platform: template
    name: "AC Input Power Heating"
    id: power_in_heating
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 0
