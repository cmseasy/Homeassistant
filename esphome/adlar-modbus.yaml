esphome:
  name: "adlar-modbus"
  friendly_name: Adlar modbus
  min_version: 2025.11.0
  name_add_mac_suffix: false

  on_boot:
    priority: -100
    then:
      - text_sensor.template.publish:
          id: online_template
          state: "gestart"
  on_shutdown:
    then:
      - text_sensor.template.publish:
          id: online_template
          state: "gestopt"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true


logger:
  level: INFO
  baud_rate: 0

api:
  port: 6053
  encryption:
    key: !secret adlar_modbus_encryption_key
  reboot_timeout: 0s  

ota:
  - platform: esphome
    password: !secret adlar_modbus_ota_pass

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.40
    gateway: 192.168.1.1
    dns1: 192.168.1.5 
    subnet: 255.255.255.0
  use_address: 192.168.1.40
  fast_connect: true
  power_save_mode: NONE
 
  ap:
    ssid: !secret adlar_modbus_wifi_ap_ssid
    password: !secret adlar_modbus_wifi_ap_password

time:
  - platform: homeassistant
    id: homeassistant_time

captive_portal:

web_server:
  port: 80
  version: 3
  local: true
  include_internal: true
  sorting_groups:
    - id: sorting_group_configuration_setup
      name: "Configuration setup"
      sorting_weight: 10
    - id: sorting_group_number_settings
      name: "Number settings"
      sorting_weight: 20

# Adlar modbus UART
uart:
  - id: uart_modbus
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600
    data_bits: 8
    stop_bits: 1
    parity: NONE
    rx_buffer_size: 512
    rx_timeout: 4       # ESP32-specifiek: geeft de Adlar-chip meer tijd tussen losse bytes

# De juiste plek voor de maximale wachttijd (timeout)
modbus:
  - uart_id: uart_modbus
    id: modbus_client
    send_wait_time: 1000ms   # Verhoogd naar 1000ms om de trage Adlar meer tijd te geven
    turnaround_time: 100ms   # Iets meer rusttijd tussen opeenvolgende commando's

modbus_controller:
  - id: modbus_adlar
    modbus_id: modbus_client
    address: 0x01
    update_interval: 30s
    command_throttle: 300ms  # Verhoogd: geef de warmtepomp 300ms ademruimte tussen registers
    setup_priority: -100

  - id: modbus_adlar_traag
    modbus_id: modbus_client
    address: 0x01
    update_interval: 293s # Een priemgetal (~5 min) zodat hij bijna nooit tegelijk start met de 30s cyclus
    command_throttle: 293ms  # Verhoogd: geef de warmtepomp 300ms ademruimte tussen registers
    setup_priority: -100
        
  - id: modbus_adlar_statisch # voor bv setpoints die niet vaak veranderen
    modbus_id: modbus_client
    address: 0x01
    update_interval: 43207s  # Ongeveer 12 uur en een priemgetal
    command_throttle: 300ms  # Verhoogd: geef de warmtepomp 300ms ademruimte tussen registers
    setup_priority: -100


